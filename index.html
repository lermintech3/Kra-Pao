<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0EA5E9">
<title>กระเป๋าเงินของเรา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Noto+Serif+Thai:wght@600;700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --ink2:#3C3C43; --muted:#8E8E93; --sep:rgba(60,60,67,.12);
  --fill:rgba(118,118,128,.12); --blue:#007AFF; --orange:#FF8A00; --pink:#FF2D55; --teal:#20A8C0;
  --purple:#AF52DE; --green:#30C26A; --indigo:#5856D6; --gold:#D9A400; --red:#FF3B30;
  --good:#1E9E50; --bad:#E0262B;
  --r:22px; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 10px) 16px calc(var(--sb) + 110px)}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 2px}
.hello{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:2px 2px 12px;line-height:1.15}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s}
.icon-btn:active{transform:scale(.9)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--card);padding:6px 10px;border-radius:99px;box-shadow:var(--shadow)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:#F5A400} .dot.err{background:var(--bad)}
/* month switch */
.month{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:6px;box-shadow:var(--shadow);margin-bottom:14px}
.month b{font-size:16px;font-weight:700}
.month button{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--blue);font-size:20px}
.month button:active{background:var(--fill)}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-size:13px;font-weight:500;color:var(--muted)}
.link{color:var(--blue);font-size:15px;font-weight:600}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:28px;padding:20px;margin-bottom:14px;
  background:linear-gradient(135deg,#FF2D55 0%,#FF6A3D 35%,#AF52DE 75%,#5856D6 100%);box-shadow:0 14px 34px rgba(175,82,222,.35)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero:before{width:220px;height:220px;right:-70px;top:-90px}
.hero:after{width:140px;height:140px;left:-40px;bottom:-70px}
.hero .lbl{font-size:14px;opacity:.9;font-weight:600}
.hero .amt{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:4px 0 14px;line-height:1.1}
.hero .row{display:flex;gap:10px;position:relative;z-index:1}
.chip{flex:1;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:10px 12px}
.chip span{display:block;font-size:12px;opacity:.9}
.chip b{font-size:17px}
.rate{position:relative;z-index:1;margin-top:12px;font-size:13px;opacity:.95}
.rate .bar{height:8px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:6px;overflow:hidden}
.rate .bar i{display:block;height:100%;border-radius:9px;background:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{border-radius:20px;padding:14px;color:#fff;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.tile span{font-size:12.5px;font-weight:600;opacity:.92}
.tile b{font-size:21px;font-weight:800;letter-spacing:-.01em}
.tile em{font-style:normal;font-size:11.5px;opacity:.9}
.g1{background:linear-gradient(145deg,#0A84FF,#5E5CE6)}
.g2{background:linear-gradient(145deg,#FF9F0A,#FF375F)}
.g3{background:linear-gradient(145deg,#30D158,#00A6A6)}
.g4{background:linear-gradient(145deg,#BF5AF2,#FF2D92)}
/* list rows */
.row-i{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--sep)}
.row-i:last-child{border-bottom:0}
.row-i.tap{cursor:pointer;border-radius:12px;transition:background .15s}
.row-i.tap:active{background:var(--fill)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;color:#fff}
.grow{flex:1;min-width:0}
.t1{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amtR{font-weight:700;font-size:15.5px;text-align:right;white-space:nowrap}
.inc{color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--fill);color:var(--ink2)}
.swatch{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
/* donut */
.donut-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{position:relative;width:150px;height:150px;flex:none}
.donut svg{width:150px;height:150px;transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:28px}
.donut .ctr span{font-size:11.5px;color:var(--muted)}
.donut .ctr b{font-size:17px;font-weight:800}
.donut circle.seg{cursor:pointer;transition:stroke-width .2s}
.legend{flex:1 1 230px;min-width:0}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 6px;border-radius:8px;cursor:pointer}
.lg.on{background:var(--fill)}
.lg .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.lg .v{font-weight:700}
.lg .p{color:var(--muted);width:36px;text-align:right;font-size:12px}
/* split */
.split{display:flex;height:14px;border-radius:9px;overflow:hidden;gap:2px;background:var(--card)}
.split i{display:block;height:100%}
.split i:first-child{border-radius:9px 0 0 9px}.split i:last-child{border-radius:0 9px 9px 0}
.splitL{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.splitL div{background:var(--bg);border-radius:14px;padding:10px}
.splitL span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.splitL b{display:block;font-size:15px;margin-top:3px}
/* bar chart */
.bars{position:relative}
.bars svg{width:100%;height:190px;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:rgba(28,28,30,.92);color:#fff;font-size:12px;padding:8px 10px;border-radius:12px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .15s;z-index:3}
.tip.show{opacity:1}
.keys{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.keys span{display:inline-flex;align-items:center;gap:6px}
/* insights */
.ins{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.ins .e{font-size:20px;line-height:1.2}
.ins p{margin:0;font-size:14px;color:var(--ink2);line-height:1.45}
/* segmented */
.seg-c{display:flex;background:var(--fill);border-radius:11px;padding:2px;margin-bottom:12px}
.seg-c button{flex:1;padding:7px 4px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);transition:all .2s}
.seg-c button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 13px;border-radius:99px;background:var(--card);font-size:13.5px;font-weight:600;box-shadow:var(--shadow)}
.chips button.on{background:var(--ink);color:#fff}
.dayh{font-size:13px;color:var(--muted);font-weight:600;margin:14px 6px 6px;display:flex;justify-content:space-between}
/* budget */
.pb{height:10px;border-radius:9px;background:var(--fill);overflow:hidden;margin-top:7px}
.pb i{display:block;height:100%;border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.over{color:var(--bad);font-weight:700}
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{width:120px;height:120px;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ctr b{font-size:24px;font-weight:800}
.ring .ctr span{font-size:11px;color:var(--muted)}
.kv{font-size:14px;color:var(--ink2);line-height:1.8}
.kv b{color:var(--ink)}
/* goals */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal{border-radius:22px;padding:14px;color:#fff;position:relative;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.goal:active{transform:scale(.97)}
.goal .em{font-size:28px}
.goal .nm{font-weight:700;font-size:15px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .sv{font-size:12.5px;opacity:.95;margin-top:2px}
.goal .gb{height:7px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:10px;overflow:hidden}
.goal .gb i{display:block;height:100%;background:#fff;border-radius:9px}
.goal .pc{position:absolute;right:12px;top:12px;font-weight:800;font-size:15px}
.add-tile{border:2px dashed rgba(60,60,67,.2);border-radius:22px;display:grid;place-items:center;min-height:140px;color:var(--muted);font-weight:600;font-size:14px;background:transparent}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .e{font-size:44px}
.empty p{margin:8px 0 14px;font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:14px;font-weight:700;font-size:16px;background:var(--blue);color:#fff;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.full{width:100%}
.btn.grad{background:linear-gradient(135deg,#FF2D55,#AF52DE)}
.btn.ghost{background:var(--fill);color:var(--blue)}
.btn.danger{background:rgba(255,59,48,.12);color:var(--red)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:11px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(var(--sb) + 8px);pointer-events:none}
.tabin{max-width:520px;margin:0 auto;pointer-events:auto;display:flex;align-items:center;justify-content:space-around;
  background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-radius:28px;padding:8px 6px;box-shadow:0 10px 30px rgba(0,0,0,.12),inset 0 0 0 .5px rgba(0,0,0,.06)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);width:64px;padding:4px 0;border-radius:16px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--pink)}
.fab{width:56px;height:56px;border-radius:50%;margin-top:-26px;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:400;
  background:conic-gradient(from 200deg,#FF2D55,#FF8A00,#FFCC00,#30C26A,#20A8C0,#007AFF,#AF52DE,#FF2D55);box-shadow:0 10px 24px rgba(255,45,85,.4);transition:transform .15s}
.fab span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#FF2D55,#AF52DE)}
.fab:active{transform:scale(.9) rotate(90deg)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;
  transform:translateY(105%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s .42s;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.on{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s}
.grab{width:38px;height:5px;border-radius:9px;background:rgba(60,60,67,.3);margin:8px auto 2px}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px}
.sh-head b{font-size:17px}
.sh-head button{color:var(--blue);font-size:16px;font-weight:600;min-width:60px;text-align:left}
.sh-head button:last-child{text-align:right}
.sh-body{overflow-y:auto;padding:4px 16px calc(var(--sb) + 20px);-webkit-overflow-scrolling:touch}
.group{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:14px}
.field{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:.5px solid var(--sep);min-height:48px}
.field:last-child{border-bottom:0}
.field label{font-size:15.5px;width:96px;flex:none;color:var(--ink)}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;outline:none;background:none;font-size:16px;text-align:right;color:var(--ink2)}
.field textarea{text-align:left;resize:none}
.glabel{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:4px 14px 6px}
.amount-box{text-align:center;padding:10px 0 16px}
.amount-box .cur{font-size:28px;font-weight:700;color:var(--muted);vertical-align:top;margin-right:2px}
.amount-box input{border:0;outline:none;background:none;font-size:46px;font-weight:800;width:72%;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:16px;background:var(--card);font-size:11.5px;font-weight:600;color:var(--ink2);transition:transform .12s;border:2px solid transparent}
.cat .ic{width:42px;height:42px}
.cat.on{border-color:var(--ink);color:var(--ink)}
.cat:active{transform:scale(.94)}
.who{display:flex;gap:8px;margin-bottom:14px}
.who button{flex:1;background:var(--card);border-radius:14px;padding:10px 4px;font-weight:600;font-size:14px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.who button .e{font-size:22px}
.who button.on{border-color:var(--ink)}
/* toast & dialog */
.toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translate(-50%,-140%);background:rgba(28,28,30,.92);color:#fff;padding:11px 16px;border-radius:16px;font-size:14px;font-weight:600;z-index:60;transition:transform .35s cubic-bezier(.2,.9,.2,1);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.dlg{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.3)}
.dlg.on{display:flex}
.dlg .box{width:280px;background:rgba(245,245,247,.96);backdrop-filter:blur(20px);border-radius:16px;overflow:hidden;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:scale(1.15);opacity:0}to{transform:none;opacity:1}}
.dlg .box h4{margin:18px 16px 4px;font-size:17px}
.dlg .box p{margin:0 16px 16px;font-size:13.5px;color:var(--ink2)}
.dlg .acts{display:flex;border-top:.5px solid var(--sep)}
.dlg .acts button{flex:1;padding:12px;font-size:17px;color:var(--blue)}
.dlg .acts button+button{border-left:.5px solid var(--sep);font-weight:600}
.dlg .acts button.red{color:var(--red)}
.view{display:none;animation:fade .3s}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:6px 6px 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
table.tv{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.tv td,table.tv th{padding:6px 4px;border-bottom:.5px solid var(--sep);text-align:right}
table.tv td:first-child,table.tv th:first-child{text-align:left}
details summary{font-size:13px;color:var(--blue);cursor:pointer;margin-top:10px;font-weight:600}
/* ===== v2 additions ===== */
.tab{width:62px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.qa button{background:var(--card);border-radius:18px;padding:12px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink2);box-shadow:var(--shadow);transition:transform .12s}
.qa button:active{transform:scale(.94)}
.qa .ic{width:40px;height:40px;font-size:19px;border-radius:13px}
.tile.tap{cursor:pointer;transition:transform .12s}.tile.tap:active{transform:scale(.97)}
.g5{background:linear-gradient(145deg,#FF2D55,#FF8A00)}
.g6{background:linear-gradient(145deg,#5E5CE6,#BF5AF2)}
.pb{position:relative}
.pb .mk{position:absolute;top:0;bottom:0;width:2px;background:rgba(28,28,30,.55);border-radius:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12.5px;font-weight:600;background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.cal .d.x{background:transparent;cursor:default}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .d small{font-size:9.5px;font-weight:800;line-height:1}
.cal .d small.ok{color:var(--good)}.cal .d small.bad{color:var(--bad)}.cal .d small.due{color:var(--ink2)}
.hm-l{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);justify-content:flex-end;margin-top:10px}
.hm-l i{width:14px;height:14px;border-radius:4px;display:inline-block}
.fac{padding:10px 0;border-bottom:.5px solid var(--sep)}.fac:last-child{border-bottom:0}
.fac .fh{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600}
.fac .fh .v{margin-left:auto;font-weight:700}
.fac p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.tag{display:inline-block;font-size:11px;color:var(--blue);font-weight:700;margin-left:4px}
.sw{width:51px;height:31px;border-radius:99px;background:rgba(120,120,128,.24);position:relative;flex:none;transition:background .2s;margin-left:auto}
.sw.on{background:#34C759}
.sw:after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.sw.on:after{left:22px}
.stack{display:flex;height:16px;border-radius:9px;overflow:hidden;gap:2px;background:var(--card)}
.stack i{display:block;height:100%}
.kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi3>div{background:var(--bg);border-radius:14px;padding:10px;min-width:0}
.kpi3 span{display:block;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi3 b{display:block;font-size:15px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi2>div{background:var(--bg);border-radius:14px;padding:10px}
.kpi2 span{display:block;font-size:11.5px;color:var(--ink2)}
.kpi2 b{display:block;font-size:16px;margin-top:3px}
.lineC{position:relative}
.lineC svg{width:100%;height:180px;display:block;overflow:visible}
.range{width:100%;accent-color:#FF2D55;margin:8px 0 2px}
.chips.in button{box-shadow:none;background:var(--card);font-size:13px;padding:7px 11px}
.chips.in button:active{transform:scale(.95)}
.chips.in button.on{background:var(--ink);color:#fff}
.card .chips.in button{background:var(--fill)}
.card .chips.in button.on{background:var(--ink);color:#fff}
.calc{font-size:13px;color:var(--muted);text-align:center;margin:-10px 0 10px;min-height:18px;font-weight:600}
.keys2{display:flex;gap:6px;justify-content:center;margin:-4px 0 14px}
.keys2 button{flex:1;min-width:0;padding:7px 0;border-radius:11px;background:var(--card);font-weight:700;font-size:14px;color:var(--ink2)}
.keys2 button:active{background:var(--fill)}
.hintB{font-size:12.5px;color:var(--ink2);background:var(--card);border-radius:12px;padding:9px 12px;margin:-4px 0 14px;display:none}
.hintB.on{display:block}
.gauge{position:relative;width:132px;height:132px;flex:none}
.gauge svg{width:132px;height:132px;transform:rotate(-90deg)}
.gauge .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .ctr b{font-size:34px;font-weight:800;line-height:1}
.gauge .ctr span{font-size:11.5px;color:var(--muted);margin-top:2px}
.gradeP{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:15px;padding:6px 12px;border-radius:99px;background:var(--fill)}
.lst{font-size:14px;color:var(--ink2);line-height:1.5}
.lst .r{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:.5px solid var(--sep)}
.lst .r:last-child{border-bottom:0}
.lst .r b{color:var(--ink);white-space:nowrap}
.lst .r.tot{font-weight:700;color:var(--ink);border-top:1px solid var(--sep);border-bottom:0}
.up{color:var(--bad);font-weight:700}.dn{color:var(--good);font-weight:700}
.dhero{background:linear-gradient(135deg,#FF375F 0%,#FF6A3D 45%,#FF9F0A 100%);box-shadow:0 14px 34px rgba(255,90,60,.32)}
.ghero{background:linear-gradient(135deg,#30D158,#00A6A6 55%,#0A84FF);box-shadow:0 14px 34px rgba(0,166,166,.3)}
.cta{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px;cursor:pointer;width:100%;text-align:left}
.cta .ic{width:44px;height:44px;font-size:22px}
.cta .t1{white-space:normal}
.cta .t2{white-space:normal}
.mini{font-size:12px;color:var(--muted)}
.seg-c.sm button{font-size:12.5px;padding:7px 2px}
.planM{margin-bottom:14px}
@media (max-width:360px){.qa{gap:6px}.qa button{font-size:10.5px}.hero .amt{font-size:34px}}
/* ===== quick entry (iOS keypad) ===== */
.amt-disp{text-align:center;padding:4px 0 8px}
.amt-disp .expr{font-size:14px;color:var(--muted);min-height:18px;font-variant-numeric:tabular-nums}
.amt-big{font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.cat-row{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.cat-row::-webkit-scrollbar{display:none}
.cchip{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;padding:8px 2px;border-radius:16px;background:var(--card);font-size:11px;font-weight:600;color:var(--ink2);border:2px solid transparent;transition:transform .12s}
.cchip .ic{width:40px;height:40px;font-size:20px}
.cchip.on{border-color:var(--c);color:var(--ink);box-shadow:0 6px 14px rgba(0,0,0,.08)}
.cchip:active{transform:scale(.93)}
.date-row{display:flex;gap:8px;margin-bottom:10px}
.date-row>*{flex:1;background:var(--card);border-radius:12px;padding:9px 6px;font-size:13.5px;font-weight:600;color:var(--ink2);text-align:center;border:2px solid transparent}
.date-row .on{border-color:var(--ink);color:var(--ink)}
.dpick{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;flex:1.4!important;cursor:pointer;white-space:nowrap;overflow:hidden}
.dpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.note-in{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.note-in input{flex:1;border:0;outline:none;background:none;font-size:16px}
.sugg{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.sugg:empty{display:none}
.sugg::-webkit-scrollbar{display:none}
.sugg button{flex:none;padding:6px 11px;border-radius:99px;background:rgba(0,122,255,.1);color:var(--blue);font-size:12.5px;font-weight:600}
.keypad{position:sticky;bottom:calc(-1*(var(--sb) + 20px));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px -16px calc(-1*(var(--sb) + 20px));padding:10px 12px calc(var(--sb) + 14px);
  background:rgba(209,212,219,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.keypad button{height:50px;border-radius:12px;background:#fff;font-size:24px;font-weight:500;box-shadow:0 1px 0 rgba(0,0,0,.3);transition:background .08s,transform .08s}
.keypad button:active{background:#D1D4DB;transform:scale(.96)}
.keypad .op{background:#ADB3BC;color:#1C1C1E;font-size:22px}
.keypad .ok{background:linear-gradient(135deg,#FF2D55,#B444E0);color:#fff;font-size:26px;font-weight:700}
/* login (Firebase mode) */
.login{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;color:#fff;
  background:radial-gradient(120% 80% at 100% 0%,#FFB13D 0%,rgba(255,177,61,0) 55%),linear-gradient(150deg,#FF5E3A,#FF2D55 45%,#B444E0)}
.login.on{display:flex}
.login .logo{width:92px;height:92px;border-radius:26px;background:rgba(255,255,255,.25);display:grid;place-items:center;font-size:48px;box-shadow:0 12px 30px rgba(0,0,0,.15)}
.login h1{margin:4px 0 0;font-size:28px}
.login p{margin:0 0 12px;opacity:.92;font-size:15px;max-width:300px;line-height:1.5}
.login .gbtn{background:#fff;color:#1C1C1E;border-radius:16px;padding:14px 22px;font-weight:700;font-size:16px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 24px rgba(0,0,0,.15)}
.login small{opacity:.85;font-size:12.5px;max-width:300px}
/* ===== e-wallet home ===== */
.wh{margin:calc(-1*(var(--st) + 10px)) -16px 0;padding:calc(var(--st) + 16px) 18px 78px;border-radius:0 0 34px 34px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 0%,#FFB13D 0%,rgba(255,177,61,0) 55%),linear-gradient(140deg,#FF5E3A 0%,#FF2D55 45%,#B444E0 100%)}
.wh:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-90px;bottom:-150px;background:rgba(255,255,255,.12)}
.wh:after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;left:-40px;top:40px;background:rgba(255,255,255,.08)}
.wh-top{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.avs{display:flex}
.avs span{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;font-size:22px;border:2px solid rgba(255,255,255,.6);box-shadow:0 4px 12px rgba(0,0,0,.12)}
.avs span+span{margin-left:-12px}
.wh-hi{flex:1;min-width:0}
.wh-hi small{display:block;font-size:12.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh-hi b{display:block;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.glass{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .15s}
.glass:active{transform:scale(.9)}
.wh .sync{background:rgba(255,255,255,.22);color:#fff;box-shadow:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);flex:none}
.bal{position:relative;z-index:2;margin:-62px 0 14px;background:var(--card);border-radius:26px;padding:18px;box-shadow:0 18px 40px rgba(255,45,85,.18),0 2px 6px rgba(0,0,0,.05)}
.bal-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bal-h span{font-size:13.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
.eye{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--fill)}
.mini-m{display:flex;align-items:center;gap:2px;background:var(--fill);border-radius:99px;padding:2px}
.mini-m button{width:26px;height:26px;border-radius:50%;color:var(--pink);font-size:17px;font-weight:700}
.mini-m b{font-size:12.5px;font-weight:700;padding:0 4px;white-space:nowrap}
.bal-amt{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:6px 0 12px;line-height:1.1}
.bal-amt.neg{color:var(--bad)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io div{border-radius:16px;padding:10px 12px;background:var(--bg)}
.io span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);font-weight:600}
.io span i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-style:normal;font-size:12px}
.io b{display:block;font-size:17px;margin-top:3px}
.bal .rate{color:var(--ink2);margin-top:12px;font-size:12.5px}
.bal .rate .bar{height:8px;border-radius:9px;background:var(--fill);margin-top:6px;overflow:hidden}
.bal .rate .bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#FF5E3A,#FF2D55,#B444E0)}
.qa button .ic{box-shadow:0 6px 14px rgba(0,0,0,.12)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 14px;padding:2px 16px 6px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.promo{flex:0 0 84%;min-width:0;scroll-snap-align:center;border-radius:22px;padding:16px;color:#fff;display:flex;gap:12px;align-items:center;min-height:96px;box-shadow:var(--shadow)}
.promo .e{font-size:30px;flex:none;width:54px;height:54px;border-radius:16px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.promo p{margin:0;font-size:14px;line-height:1.45}
.promo p b{font-weight:800}
.sec-t{font-size:20px;font-weight:800;margin:6px 4px 10px}
.dots{display:flex;justify-content:center;gap:5px;margin:-6px 0 14px}
.dots i{width:6px;height:6px;border-radius:9px;background:rgba(60,60,67,.2);transition:all .25s}
.dots i.on{width:18px;background:var(--pink)}
@media (min-width:700px){.app{padding-top:28px}}

.card:before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 38%)}
.card>*{position:relative}

.link,.sh-head button{color:#0891B2}

.wh:before{background:radial-gradient(circle,rgba(255,255,255,.35),rgba(255,255,255,0) 65%);width:300px;height:300px;right:-110px;bottom:-160px}
.wh:after{display:block;width:160px;height:160px;left:-60px;top:20px;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.35),rgba(255,255,255,0) 65%)}
.avs span{background:linear-gradient(160deg,#fff,#DDF4F8);color:#0369A1;font-weight:800;font-size:17px;border:2px solid rgba(255,255,255,.85);box-shadow:inset 0 -2px 4px rgba(3,105,161,.15),0 6px 14px rgba(3,60,90,.3)}

.glass,.wh .sync{background:rgba(255,255,255,.2)!important;border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
.wh .sync{color:#fff}
.wh-hi b{font-size:20px;text-shadow:0 2px 10px rgba(0,40,60,.25)}
/* balance card: deep ocean glass */
.bal{margin-top:-80px;color:#fff;border-radius:28px;padding:20px 20px 18px;overflow:hidden;isolation:isolate;
  background:var(--art-card) center/cover no-repeat,radial-gradient(90% 70% at 100% 0%,rgba(110,231,183,.75),rgba(110,231,183,0) 60%),linear-gradient(140deg,#075985 0%,#0284C7 35%,#0891B2 65%,#059669 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 0 0 1px rgba(255,255,255,.25),inset 0 -14px 30px rgba(0,30,50,.25),0 26px 50px -16px rgba(3,105,161,.65)}
.bal:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 40%,rgba(255,255,255,0) 41%),linear-gradient(115deg,transparent 30%,rgba(255,255,255,.28) 45%,rgba(255,255,255,.06) 50%,transparent 62%);background-size:100% 100%,250% 100%;animation:sheen 7s ease-in-out infinite}
@keyframes sheen{0%,100%{background-position:0 0,120% 0}50%{background-position:0 0,-20% 0}}
.bal:after{content:"";position:absolute;right:20px;top:58px;width:44px;height:34px;background:var(--art-chip) no-repeat;filter:drop-shadow(0 2px 3px rgba(0,30,50,.35))}
.bal-h span{color:rgba(255,255,255,.92)}
.eye,.mini-m{background:rgba(255,255,255,.18)!important;border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.eye,.mini-m b,.mini-m button{color:#fff}
.bal-amt{font-size:40px;margin:10px 0 16px;color:#fff;text-shadow:0 2px 14px rgba(0,40,60,.3)}
.bal-amt.neg{color:#FFE4E6}
.io div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.45)}
.io span{color:rgba(255,255,255,.9)}
.io b{color:#fff}
.io span i{width:22px;height:22px;box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
.io span i svg{width:14px;height:14px}
.bal .rate{color:rgba(255,255,255,.92)}
.bal .rate b{color:#fff}
.bal .rate .bar{background:rgba(255,255,255,.22);height:8px;box-shadow:inset 0 1px 2px rgba(0,30,50,.25)}
.bal .rate .bar i{background:linear-gradient(180deg,#fff,#D1FAE5);box-shadow:0 0 10px rgba(255,255,255,.8)}
/* tinted glass tiles */
.tile{position:relative;overflow:hidden;border-radius:24px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.3),inset 0 -10px 24px rgba(0,30,50,.15),0 16px 30px -14px rgba(3,90,120,.55)}
.tile:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.32),rgba(255,255,255,.04) 45%,rgba(255,255,255,0) 46%),var(--art-pat);pointer-events:none}
.tile:after{content:"";position:absolute;width:130px;height:130px;right:-45px;top:-55px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(255,255,255,.45),rgba(255,255,255,0) 65%);pointer-events:none}
.tile>*{position:relative;z-index:1}
.tile span{display:flex;align-items:center;gap:6px}
.tile span svg{width:16px;height:16px}
.tile b{text-shadow:0 2px 8px rgba(0,30,50,.25)}
.g1{background:linear-gradient(145deg,#0369A1,#0EA5E9)}
.g2{background:linear-gradient(145deg,#0E7490,#22D3EE)}
.g3{background:linear-gradient(145deg,#047857,#34D399)}
.g4{background:linear-gradient(145deg,#0F766E,#2DD4BF)}
/* quick actions */
.qa button{border-radius:20px!important}
.qa .ic{border-radius:18px}
/* carousel */
.promo{position:relative;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.3),0 16px 30px -14px rgba(3,90,120,.5)}
.promo:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 45%),var(--art-pat)}
.promo>*{position:relative}
.promo .e{background:rgba(255,255,255,.25);color:#fff;border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.promo .e svg{width:28px;height:28px}
.dots i.on{background:var(--aq2)}
/* liquid-glass tab bar & fab */
.tabin{background:rgba(255,255,255,.42)!important;backdrop-filter:blur(26px) saturate(200%);-webkit-backdrop-filter:blur(26px) saturate(200%);
  border:1px solid rgba(255,255,255,.75);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -6px 14px rgba(8,90,120,.06),0 16px 40px -10px rgba(8,90,120,.35)}
.tab{color:#5B7C88}
.tab svg{width:24px;height:24px}
.tab.on{color:#0891B2;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(224,247,250,.6));box-shadow:inset 0 1px 0 #fff,0 4px 10px rgba(8,145,178,.18)}
.fab{background:conic-gradient(from 200deg,#0EA5E9,#22D3EE,#34D399,#10B981,#0EA5E9);box-shadow:0 12px 26px -6px rgba(6,182,212,.65)}
.fab span{background:radial-gradient(circle at 35% 25%,#7DD3FC 0%,#0EA5E9 40%,#0369A1 100%);color:#fff;position:relative;overflow:hidden;box-shadow:inset 0 -4px 8px rgba(0,30,60,.3)}
.fab span:before{content:"";position:absolute;left:14%;right:14%;top:6%;height:42%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0))}
.fab span svg{width:26px;height:26px;position:relative}
.fab:active{transform:scale(.9) rotate(90deg)}
/* sheets & keypad */
.sheet{background:rgba(244,251,253,.86)!important;backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-top:1px solid rgba(255,255,255,.9)}
.btn.grad,.btn:not(.ghost):not(.danger){background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 50%),var(--aqG);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 8px 18px -8px rgba(6,140,180,.7)}
.btn.ghost{background:rgba(255,255,255,.6);color:#0891B2;box-shadow:var(--shadow)}
.keypad{background:rgba(214,236,242,.7)!important;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.keypad button{background:linear-gradient(180deg,#fff,#F2FAFC);box-shadow:0 1px 0 rgba(8,60,80,.25),inset 0 1px 0 #fff}
.keypad .op{background:linear-gradient(180deg,#CFE7EE,#B5D9E3);color:#0B2530}
.keypad .ok{background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 50%),var(--aqG);color:#fff}
.sugg button{background:rgba(6,182,212,.12);color:#0E7490}
/* goals & heroes */
.goal{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 0 0 1px rgba(255,255,255,.3),0 16px 30px -14px rgba(3,90,120,.5)}
.goal:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 45%),var(--art-pat);pointer-events:none}
.goal .em svg{width:30px;height:30px}
.hero,.dhero,.ghero{background:var(--art-card) center/cover no-repeat,linear-gradient(140deg,#075985,#0284C7 40%,#0891B2 70%,#059669)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 22px 44px -16px rgba(3,105,161,.6)!important;position:relative;overflow:hidden}
.empty .e{display:flex;justify-content:center;color:#0891B2}
.empty .e svg{width:46px;height:46px}
.over{color:#E11D48}
/* login */
.login{background:var(--art-silk) center/cover no-repeat,radial-gradient(70% 60% at 100% 0%,rgba(167,243,208,.6),transparent 60%),linear-gradient(150deg,#0369A1,#0EA5E9 45%,#06B6D4 70%,#10B981)}
.login .logo{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.5);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 20px 40px -14px rgba(0,40,60,.5)}
.login .logo svg{width:50px;height:50px}
.login .gbtn{background:#fff;color:#0369A1}
.segi{display:inline-flex;align-items:center;gap:5px}
.hic{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;color:#fff;vertical-align:-6px;margin-right:2px}
.hic svg{width:14px!important;height:14px!important}
.dpick svg{flex:none}
.who button .e svg{width:26px;height:26px}
.who button .e{color:#0891B2}
.cat svg.ie{width:26px;height:26px}
.emo-w{display:contents}
#ea,#eb{display:none!important}
/* ===== Premium banking pack ===== */
.locked .app,.locked .tabbar{visibility:hidden}
.toast{z-index:120}
.dlg{z-index:130}
#lock{position:fixed;inset:0;z-index:110;display:none;flex-direction:column;align-items:center;justify-content:space-between;color:#fff;
  padding:calc(var(--st) + 46px) 24px calc(var(--sb) + 26px);
  background:var(--art-silk) center/cover no-repeat,radial-gradient(80% 50% at 100% 0%,rgba(167,243,208,.45),transparent 60%),linear-gradient(160deg,#033E63 0%,#0369A1 35%,#0891B2 70%,#047857 100%)}
.locked #lock,#lock.on{display:flex;animation:lkIn .35s ease}
@keyframes lkIn{from{opacity:0}to{opacity:1}}
#lock .lk-top{text-align:center}
#lock .lk-logo{width:74px;height:74px;border-radius:24px;margin:0 auto 14px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(255,255,255,.38),rgba(255,255,255,.12));border:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 14px 30px rgba(0,30,50,.35);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
#lock .lk-logo svg{width:36px;height:36px}
#lock h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
#lock .lk-sub{margin-top:6px;font-size:14px;opacity:.9;min-height:20px}
#lock .lk-dots{display:flex;gap:16px;justify-content:center;margin-top:26px}
#lock .lk-dots i{width:14px;height:14px;border-radius:50%;border:1.6px solid rgba(255,255,255,.85);transition:background .15s,transform .15s}
#lock .lk-dots i.f{background:#fff;transform:scale(1.08)}
#lock.shake .lk-dots{animation:shake .4s}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
#lock .lk-pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px;justify-content:center}
#lock .lk-pad button{width:76px;height:76px;border-radius:50%;font-size:30px;font-weight:500;color:#fff;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;transition:background .1s,transform .1s}
#lock .lk-pad button small{font-size:9.5px;letter-spacing:.18em;opacity:.75;margin-top:3px;font-weight:600}
#lock .lk-pad button:active{background:rgba(255,255,255,.4);transform:scale(.94)}
#lock .lk-pad button.ghost{background:none;border:0;font-size:15px;font-weight:600}
#lock .lk-pad button.ghost svg{width:28px;height:28px}
#lock .lk-foot{font-size:12px;opacity:.75;display:flex;align-items:center;gap:6px}
#lock .lk-foot svg{width:14px;height:14px}
/* bell */
.bell{position:relative}
.bell .bdg{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#FF3B30;color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 2px rgba(255,255,255,.9)}
.nt{display:flex;gap:12px;padding:12px 0;border-bottom:.5px solid var(--sep);align-items:flex-start}
.nt:last-child{border-bottom:0}
.nt .ni{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.nt .ni svg{width:20px;height:20px}
.nt b{display:block;font-size:14.5px}
.nt p{margin:2px 0 0;font-size:13px;color:var(--ink2);line-height:1.45}
.nt .nw{width:8px;height:8px;border-radius:50%;background:#0A84FF;flex:none;margin-top:6px}
/* e-slip */
.slip{position:relative;background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 18px 40px rgba(3,60,90,.14);margin-bottom:14px}
.slip-h{position:relative;color:#fff;text-align:center;padding:24px 18px 26px;
  background:var(--art-card) center/cover no-repeat,linear-gradient(140deg,#0369A1,#0EA5E9 55%,#10B981)}
.slip-h.exp{background:var(--art-card) center/cover no-repeat,linear-gradient(140deg,#0B3B5C,#0369A1 60%,#0891B2)}
.slip-ok{width:56px;height:56px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.slip-ok svg{width:28px;height:28px}
.slip-h small{display:block;font-size:13px;opacity:.9;font-weight:600}
.slip-h .amt{font-size:36px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.slip-perf{height:18px;position:relative;background:radial-gradient(circle at 9px 0,transparent 8px,var(--card) 8.5px) -9px 0/18px 18px repeat-x;margin-top:-9px}
.slip-b{padding:4px 18px 16px}
.slip-r{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px dashed var(--sep);font-size:14px}
.slip-r:last-child{border-bottom:0}
.slip-r span{color:var(--muted);flex:none}
.slip-r b{text-align:right;font-weight:600;word-break:break-word}
.slip-f{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11.5px;color:var(--muted);padding:0 18px 16px}
.slip-f svg{width:13px;height:13px}
.acts4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.acts4 button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink2)}
.acts4 button span{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);color:#0369A1}
.acts4 button.red span{color:#E0262B}
.acts4 button:active span{transform:scale(.92)}
/* statement */
.stm-h{border-radius:24px;color:#fff;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;
  background:var(--art-card) center/cover no-repeat,linear-gradient(140deg,#033E63,#0369A1 50%,#0891B2);box-shadow:0 18px 40px rgba(3,60,90,.25)}
.stm-h .lbl{font-size:12px;opacity:.85;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.stm-h .nm{font-size:17px;font-weight:800;margin-top:2px}
.stm-h .pd{font-size:12.5px;opacity:.85;margin-top:2px}
.stm-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.stm-g div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:9px 11px}
.stm-g span{display:block;font-size:11.5px;opacity:.9}
.stm-g b{font-size:16px}
table.stm{width:100%;border-collapse:collapse;font-size:12.5px}
table.stm th{font-size:11px;color:var(--muted);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--sep)}
table.stm td{padding:8px 4px;border-bottom:.5px solid var(--sep);text-align:right;vertical-align:top}
table.stm th:first-child,table.stm td:first-child{text-align:left;white-space:nowrap}
table.stm td.d{text-align:left;color:var(--ink)}
table.stm td.d small{display:block;color:var(--muted);font-size:11px}
table.stm tr.ob td,table.stm tr.cb td{font-weight:700;background:var(--fill)}
.sec-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:.5px solid var(--sep);cursor:pointer}
.sec-row:last-child{border-bottom:0}
.sec-row .ic{width:32px;height:32px;border-radius:10px;color:#fff}
.sec-row .ic svg{width:18px;height:18px}
.sec-row .tx{flex:1;font-size:15.5px}
.sec-row .tx small{display:block;font-size:12px;color:var(--muted)}
.bal-amt.count{transition:none}
.wh .sync{padding:0;width:40px;height:40px;justify-content:center;border-radius:50%}
.wh .sync span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wh .sync .dot{width:10px;height:10px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
</style>

  <!-- PLAN -->

const KEY_LS='ourwallet.key';
function makeD1(url,key){
  const cache={}, subs=[]; let since=0, failing=false, timer=null;
  const api=async(method,path,body)=>{
    const r=await fetch(url+path,{method,headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json'},body:body==null?undefined:JSON.stringify(body)});
    if(r.status===401){const e=new Error('unauthorized');e.code='permission-denied';throw e}
    if(!r.ok){const e=new Error('HTTP '+r.status);e.code='unavailable';throw e}
    return r.json()};
  const snapCol=col=>{const docs=Object.keys(cache).filter(k=>k.startsWith(col+'/')&&!cache[k].deleted)
      .map(k=>({id:k.slice(col.length+1),exists:true,data:()=>cache[k].data}));return {docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false}}};
  const snapDoc=path=>{const c=cache[path];const ex=!!(c&&!c.deleted);return {id:path.split('/').pop(),exists:ex,data:()=>ex?c.data:undefined,metadata:{fromCache:false,hasPendingWrites:false}}};
  const emit=()=>subs.forEach(s=>s.next(s.path.includes('/')?snapDoc(s.path):snapCol(s.path)));
  const poll=async()=>{
    try{const j=await api('GET','/api/all?since='+since);let ch=since===0;
      (j.docs||[]).forEach(d=>{let data={};try{data=JSON.parse(d.data)}catch(e){}cache[d.col+'/'+d.id]={data,deleted:!!d.deleted};ch=true});
      since=j.now;if(ch)emit();
      if(failing){failing=false;setSync('ok','ซิงค์แล้ว')}}
    catch(e){if(e.code==='permission-denied'){clearInterval(timer);try{localStorage.removeItem(KEY_LS)}catch(_){}toast('รหัสบ้านไม่ถูกต้อง');showKeyLogin();return}
      failing=true;setSync('err','ออฟไลน์ · จะลองใหม่')}};
  const ref=path=>({
    set:async data=>{await api('PUT','/api/doc/'+path,data);cache[path]={data,deleted:false}},
    delete:async()=>{await api('DELETE','/api/doc/'+path);if(cache[path])cache[path].deleted=true},
    onSnapshot:(next,err)=>{subs.push({path,next,err});if(since)next(snapDoc(path));return ()=>{}}});
  const db={
    doc:ref,
    collection:col=>({doc:id=>ref(col+'/'+id),onSnapshot:(next,err)=>{subs.push({path:col,next,err});if(since)next(snapCol(col));return ()=>{}}})};
  db.start=()=>{poll();timer=setInterval(()=>{if(!document.hidden)poll()},8000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll()});window.addEventListener('focus',poll)};
  db.test=()=>api('GET','/api/all?since=9999999999999');
  return db;
}

function txOf(k){return S.tx.filter(t=>(t.date||'').slice(0,7)===k)}
function sumAmt(a){return a.reduce((s,x)=>s+(+x.amount||0),0)}
function sumBy(list,type){return sumAmt(list.filter(t=>t.type===type))}
function catTotals(list){const m={};list.filter(t=>t.type==='expense').forEach(t=>{m[t.cat]=(m[t.cat]||0)+(+t.amount||0)});return m}
function budgetTotal(){const b=S.settings.budgets||{};return EXP.reduce((s,c)=>s+(+b[c.id]||0),0)}
function billType(b){return b.type==='income'?'income':'expense'}
function recur(type){return S.bills.filter(b=>billType(b)===type)}
function isPaid(b,mk){return !!(b.paid&&b.paid[mk])}
function debtPaidIn(d,mk){return (d.log||[]).some(l=>(l.d||'').slice(0,7)===mk&&l.a>0)}

/* average of the last n complete months that have data */
function hist(n){n=n||3;const base=monthKey(new Date());let I=0,E=0,c=0;
  for(let i=1;i<=n;i++){const l=txOf(shiftMonth(base,-i));if(!l.length)continue;I+=sumBy(l,'income');E+=sumBy(l,'expense');c++}
  const ri=sumAmt(recur('income')),re=sumAmt(recur('expense'));
  if(!c){const l=txOf(base),dn=new Date().getDate(),dim=daysIn(base);const e=sumBy(l,'expense');
    return {inc:Math.max(sumBy(l,'income'),ri),exp:Math.max(e/Math.max(dn,10)*dim,e,re),n:0}}
  return {inc:(I/c)||ri,exp:E/c,n:c}}
function catAvg(n){n=n||3;const base=monthKey(new Date());const m={};let c=0;
  for(let i=1;i<=n;i++){const l=txOf(shiftMonth(base,-i));if(!l.length)continue;c++;const ct=catTotals(l);for(const k in ct)m[k]=(m[k]||0)+ct[k]}
  if(!c){return catTotals(txOf(base))}
  for(const k in m)m[k]/=c;return m}

function outlook(){

/* upcoming recurring items within N days (incl. overdue this month) */
function upcoming(days){days=days||7;const now=new Date(),out=[];const lim=new Date(now);lim.setDate(lim.getDate()+days);
  [0,1].forEach(off=>{const mk=shiftMonth(monthKey(now),off);const dim=daysIn(mk);
    S.bills.forEach(b=>{if(isPaid(b,mk))return;const d=new Date(+mk.slice(0,4),+mk.slice(5)-1,Math.min(b.day||1,dim));
      const late=off===0&&d.getDate()<now.getDate();if(d<=lim&&(late||d>=new Date(now.getFullYear(),now.getMonth(),now.getDate())))out.push({kind:billType(b),b,mk,date:dstr(d),late,amount:+b.amount,name:b.name,id:b.id});});
    S.debts.forEach(x=>{if(!(+x.balance>0)||!x.day||debtPaidIn(x,mk))return;const d=new Date(+mk.slice(0,4),+mk.slice(5)-1,Math.min(x.day,dim));
      const late=off===0&&d.getDate()<now.getDate();if(d<=lim&&(late||d>=new Date(now.getFullYear(),now.getMonth(),now.getDate())))out.push({kind:'debt',b:x,mk,date:dstr(d),late,amount:Math.min(+x.min||0,+x.balance),name:x.name,id:x.id});});
  });

/* debt payoff simulation */
function simDebts(strat,extra){
  const ds=S.debts.filter(d=>+d.balance>0).map(d=>({id:d.id,name:d.name,e:d.e,b:+d.balance,r:(+d.rate||0)/1200,m:+d.min||0}));
  if(!ds.length)return null;
  const sorter=strat==='snowball'?(a,b)=>a.b-b.b:(a,b)=>b.r-a.r||a.b-b.b;
  const order=[...ds].sort(sorter).map(d=>d.id);
  const budget=ds.reduce((s,d)=>s+d.m,0)+(+extra||0);
  let month=0,interest=0;const payoff={},series=[ds.reduce((s,d)=>s+d.b,0)];
  while(month<600&&ds.some(d=>d.b>0.01)){
    month++;let avail=budget;
    ds.forEach(d=>{if(d.b<=0.01)return;const i=d.b*d.r;interest+=i;d.b+=i});
    ds.forEach(d=>{if(d.b<=0.01)return;const p=Math.min(d.m,d.b,avail);d.b-=p;avail-=p});
    for(const d of [...ds].filter(x=>x.b>0.01).sort(sorter)){if(avail<=0)break;const p=Math.min(avail,d.b);d.b-=p;avail-=p}
    ds.forEach(d=>{if(d.b<=0.01&&!payoff[d.id])payoff[d.id]=month});
    const tot=ds.reduce((s,d)=>s+Math.max(0,d.b),0);series.push(tot);
    if(month>=3&&tot>=series[month-3]-0.01&&tot>0)return {never:true,order,budget};
  }
  return {months:month,interest,payoff,series,order,budget};
}

/* ================= amount expression (no eval) ================= */
function evalAmt(raw){let s=String(raw||'').replace(/,/g,'').replace(/[x×]/gi,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s/g,'');
  if(!s||!/^[\d.+\-*/]+$/.test(s))return NaN;let i=0;
  const num=()=>{const m=s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const term=()=>{let v=num();while(s[i]==='*'||s[i]==='/'){const o=s[i++];const n=num();v=o==='*'?v*n:v/n}return v};
  try{let v=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++];const n=term();v=o==='+'?v+n:v-n}
    if(i!==s.length)return NaN;return isFinite(v)?Math.round(v*100)/100:NaN}catch(e){return NaN}}

  if(pe>0&&isCur){const dn=new Date().getDate();const pSame=sumBy(prev.filter(t=>+t.date.slice(8)<=dn),'expense');if(pSame>0){const d=Math.round((exp-pSame)/pSame*100);out.push([d>0?'📈':'📉',`เทียบช่วงเดียวกันเดือนก่อน (1–${dn}) ใช้${d>0?'มากกว่า':'น้อยกว่า'} <b>${Math.abs(d)}%</b>`])}}
  const b=S.settings.budgets||{};const over=EXP.filter(c=>+b[c.id]>0&&(ct[c.id]||0)>+b[c.id]);
  if(over.length)out.push(['⚠️',`เกินงบ: ${over.map(c=>`<b>${esc(c.name)}</b>`).join(', ')}`]);
  else if(isCur&&budT){const o=outlook();const fc=o.exp+o.unpaidExp+o.projVar;if(fc>budT)out.push(['🧭',`ถ้าใช้ในอัตรานี้ สิ้นเดือนจะเกินงบรวมประมาณ <b>${fmt(fc-budT)}</b>`])}
  if(isCur){const ca=catAvg(3);const dn=new Date().getDate(),dim=daysIn(UI.month);
    const spike=EXP.map(c=>({c,cur:ct[c.id]||0,avg:ca[c.id]||0})).filter(x=>x.avg>500&&x.cur>x.avg*1.15&&x.cur>x.avg*dn/dim*1.5).sort((a,b)=>(b.cur-b.avg)-(a.cur-a.avg))[0];
    if(spike)out.push(['🔎',`<b>${esc(spike.c.name)}</b> ใช้ไปแล้ว ${fmt(spike.cur)} สูงกว่าค่าเฉลี่ย 3 เดือน (${fmt(spike.avg)})`]);}
  if(inc>0){const r=(inc-exp)/inc;if(r*100>=saveTarget())out.push(['🌟',`ออมได้ ${Math.round(r*100)}% ของรายรับ ผ่านเป้า ${saveTarget()}% แล้ว`]);else if(r<0)out.push(['🚨',`รายจ่ายมากกว่ารายรับ ${fmt(exp-inc)}`]);}
  return out.slice(0,5);
}

function trendData(n){const out=[];for(let i=n-1;i>=0;i--){const k=shiftMonth(UI.month,-i);const l=txOf(k);out.push({k,inc:sumBy(l,'income'),exp:sumBy(l,'expense')})}return out}
function trendTable(n){const d=trendData(n);return `<details><summary>ดูเป็นตาราง</summary><table class="tv"><tr><th>เดือน</th><th>รายรับ</th><th>รายจ่าย</th><th>คงเหลือ</th></tr>${d.map(r=>`<tr><td>${monthYearShort(r.k)}</td><td class="num">${fmt(r.inc)}</td><td class="num">${fmt(r.exp)}</td><td class="num">${fmt(r.inc-r.exp)}</td></tr>`).join('')}</table></details>`}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1.5?1.5:n<=3?3:n<=6?6:10)*p}
function drawBars(id,n){
  const box=document.getElementById(id);if(!box)return;

  const bar=(x,v,c)=>{const h=Math.max(0,y(0)-y(v));if(h<=0)return '';const r=Math.min(4,h,bw/2);const top=y(v);
    return `<path d="M${x},${y(0)} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${y(0)} Z" fill="${c}"/>`};

    s+=bar(cx-bw-1,r.inc,'#007AFF')+bar(cx+1,r.exp,'#FF8A00');
    s+=`<text x="${cx}" y="${H-5}" text-anchor="middle" font-size="${n>8?9.5:11}" fill="${r.k===UI.month?'#1C1C1E':'#8E8E93'}" font-weight="${r.k===UI.month?700:400}">${monthName(r.k,true)}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="${pl+gw*i}" y="0" width="${gw}" height="${H}" fill="transparent"/>`;
  });

      box.querySelectorAll('.hit').forEach(o=>o.setAttribute('fill',o===h?'rgba(118,118,128,.08)':'transparent'))};

/* single-series line with optional labelled reference line */
function lineChart(id,pts,color,ref,tipFn){

  if(lo<0)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(60,60,67,.35)"/>`;
  if(ref){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(ref.v)}" y2="${y(ref.v)}" stroke="#3C3C43" stroke-dasharray="4 4" stroke-width="1.2" opacity=".6"/><text x="${W-pr}" y="${y(ref.v)-5}" text-anchor="end" font-size="10.5" fill="#3C3C43" font-weight="600">${esc(ref.label)}</text>`}

  s+=`<path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;

  s+=`<line class="xh" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="#3C3C43" stroke-width="1" opacity="0"/><circle class="xd" r="5" fill="${color}" stroke="#fff" stroke-width="2" opacity="0"/>`;
  s+=`<rect class="ov" x="${pl}" y="0" width="${W-pl-pr}" height="${H}" fill="transparent"/></svg><div class="tip"></div>`;
  box.innerHTML=s;
  const ov=box.querySelector('.ov'),tip=box.querySelector('.tip'),xh=box.querySelector('.xh'),xd=box.querySelector('.xd');
  const move=ev=>{const r=box.getBoundingClientRect();const cx=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)*W/r.width;
    const i=clamp(Math.round((cx-pl)/(W-pl-pr)*(pts.length-1)),0,pts.length-1);const p=pts[i];
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('opacity',.35);xd.setAttribute('cx',x(i));xd.setAttribute('cy',y(p.v));xd.setAttribute('opacity',1);
    tip.innerHTML=tipFn?tipFn(p,i):`<b>${esc(p.label)}</b><br>${fmt(p.v)}`;tip.style.left=clamp(x(i)/W*r.width,70,r.width-70)+'px';tip.style.top=(y(p.v)/H*r.height-8)+'px';tip.classList.add('show')};
  const out=()=>{tip.classList.remove('show');xh.setAttribute('opacity',0);xd.setAttribute('opacity',0)};
  ov.addEventListener('mousemove',move);ov.addEventListener('touchstart',move,{passive:true});ov.addEventListener('touchmove',move,{passive:true});ov.addEventListener('mouseleave',out);ov.addEventListener('click',move);

  // top
  const top=list.filter(t=>t.type==='expense').sort((a,b)=>b.amount-a.amount).slice(0,5);
  if(top.length)h+=`<div class="card"><h3>รายจ่ายก้อนใหญ่สุด</h3>${top.map(txRow).join('')}</div>`;

  const fl=Object.entries(fq).filter(x=>x[1].n>1).sort((a,b)=>b[1].s-a[1].s).slice(0,5);
  if(fl.length)h+=`<div class="card"><h3>จ่ายบ่อยที่สุด</h3><div class="lst">${fl.map(([k,v])=>`<div class="r"><span>${CAT[v.cat]?.e||''} ${esc(k)} <span class="mini">× ${v.n} ครั้ง</span></span><b class="num">${fmt(v.s)}</b></div>`).join('')}</div></div>`;
  document.getElementById('planBody').innerHTML=h;

}

/* ---------- recurring rows ---------- */
function billRow(b){const isInc=billType(b)==='income';const c=CAT[b.cat]||(isInc?CAT.salary:CAT.bills);const mk=UI.month;const pd=isPaid(b,mk);
  const today=new Date();const isCur=mk===monthKey(today);const late=isCur&&!pd&&today.getDate()>b.day;
  return `<div class="row-i"><div class="ic" style="background:${c.c}" onclick="openBill('${b.id}')">${ci(c)}</div>
  <div class="grow tap" onclick="openBill('${b.id}')" style="cursor:pointer"><div class="t1">${esc(b.name)}</div><div class="t2">ทุกวันที่ ${b.day} · ${whoEmoji(b.who)} ${esc(whoName(b.who))}${late?' · <span class="over">เลยกำหนด</span>':''}</div></div>
  <div style="text-align:right"><div class="amtR num ${isInc?'inc':''}">${isInc?'+':''}${fmt(b.amount)}</div>
  ${pd?`<button class="pill" style="margin-top:4px;background:rgba(48,194,106,.15);color:#1E9E50" onclick="unpayBill('${b.id}')">✓ ${isInc?'ได้รับแล้ว':'จ่ายแล้ว'}</button>`:`<button class="pill" style="margin-top:4px;background:${isInc?'#1E9E50':'var(--blue)'};color:#fff" onclick="payBill('${b.id}')">${isInc?'รับเงิน':'จ่าย'}</button>`}</div></div>`}
function upRow(u){const isDebt=u.kind==='debt',isInc=u.kind==='income';const c=isDebt?{c:'#E0262B',e:u.b.e||'💳'}:(CAT[u.b.cat]||CAT.bills);
  const lbl=u.late?'<span class="over">เลยกำหนด</span>':dateLabel(u.date);
  const act=isDebt?`openDebt('${u.id}')`:`payBill('${u.id}','${u.mk}')`;
  return `<div class="row-i"><div class="ic" style="background:${c.c}">${ci(c)}</div><div class="grow"><div class="t1">${isDebt?'ผ่อน ':''}${esc(u.name)}</div><div class="t2">${lbl}</div></div>
  <div style="text-align:right"><div class="amtR num ${isInc?'inc':''}">${isInc?'+':''}${fmt(u.amount)}</div><button class="pill" style="margin-top:4px;background:${isInc?'#1E9E50':'var(--blue)'};color:#fff" onclick="${act}">${isInc?'รับเงิน':'จ่าย'}</button></div></div>`}
async function payBill(id,mk,silent){const b=S.bills.find(x=>x.id===id);if(!b)return;mk=mk||UI.month;if(isPaid(b,mk))return;
  const isInc=billType(b)==='income';
  const d=Math.min(b.day||1,daysIn(mk));const t={id:uid(),type:isInc?'income':'expense',amount:+b.amount,cat:b.cat||(isInc?'salary':'bills'),who:b.who||'both',date:mk+'-'+pad(d),note:b.name,ts:Date.now(),bill:b.id};
  await write('tx',t);const nb=JSON.parse(JSON.stringify(b));nb.paid=Object.assign({},nb.paid||{},{[mk]:t.id});await write('bills',nb);
  if(!silent)toast((isInc?'บันทึกรับเงิน ':'บันทึกการจ่าย ')+b.name+' แล้ว ✓')}
async function unpayBill(id){const b=S.bills.find(x=>x.id===id);if(!b)return;const mk=UI.month;
  const ok=await confirmDlg('ยกเลิกรายการเดือนนี้?','รายการที่บันทึกไว้จากรายการประจำนี้ในเดือนนี้จะถูกลบด้วย','ยกเลิก');if(!ok)return;
  const tid=b.paid[mk];const nb=JSON.parse(JSON.stringify(b));delete nb.paid[mk];await write('bills',nb);if(tid)await remove('tx',tid)}

/* ---------- save & debt view ---------- */
function renderSave(){
  document.querySelectorAll('#saveSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===UI.save));
  if(UI.save==='debts')renderDebts();else renderGoals();
}
function goalPace(g){const since=new Date();since.setDate(since.getDate()-90);const s=dstr(since);
  const v=(g.log||[]).filter(l=>l.d>=s).reduce((a,l)=>a+(+l.a||0),0);return v/3}
function renderGoals(){
  const tot=S.goals.reduce((s,g)=>s+(+g.target||0),0), sv=S.goals.reduce((s,g)=>s+(+g.saved||0),0);
  let h='';
  if(S.goals.length)h+=`<div class="hero ghero"><div class="lbl">ออมรวมทุกเป้าหมาย</div><div class="amt num">${fmt(sv)}</div>
    <div class="rate">จากเป้ารวม ${fmt(tot)} · ${tot?Math.round(sv/tot*100):0}%<div class="bar"><i style="width:${tot?Math.min(100,sv/tot*100):0}%"></i></div></div></div>`;
  if(!S.goals.some(isEmergency)){const h0=hist(3);const em=Math.round((h0.exp||0)*(+S.settings.emMonths||6)/1000)*1000;
    h+=`<button class="cta" onclick="quickEmergency()"><span class="ic" style="background:linear-gradient(145deg,#64D2FF,#0A84FF)">🛡️</span><span class="grow"><span class="t1" style="display:block">สร้างเงินสำรองฉุกเฉิน</span><span class="t2" style="display:block">${em?`แนะนำ ${fmt(em)} (${S.settings.emMonths||6} เท่าของรายจ่ายต่อเดือน)`:'กันเงินไว้ 3–6 เดือนของรายจ่าย'}</span></span><span style="color:var(--muted);font-size:20px">›</span></button>`}
  h+=`<div class="goals">${S.goals.map((g,i)=>{const p=g.target?Math.min(100,Math.round(g.saved/g.target*100)):0;const rem=g.target-g.saved;
    let sub='';if(rem>0){if(g.deadline){const md=monthsUntil(g.deadline);sub=md>0?`ต้องออม ~${fmtK(rem/md)}/เดือน`:'⏰ ถึงกำหนดแล้ว'}
      else{const pc=goalPace(g);sub=pc>0?`ตามจังหวะนี้ ~${addMonthsLabel(Math.ceil(rem/pc))}`:'ยังไม่ได้กำหนดเวลา'}}else sub='🎉 สำเร็จแล้ว!';
    return `<div class="goal" style="background:${GOAL_G[(g.color??i)%GOAL_G.length]}" onclick="openGoal('${g.id}')"><div class="pc num">${p}%</div><div class="em">${g.e||'💰'}</div><div class="nm">${esc(g.name)}</div>
    <div class="sv num">${fmt(g.saved)} / ${fmtK(g.target)}</div><div class="gb"><i style="width:${p}%"></i></div><div class="sv" style="margin-top:6px;font-size:11.5px">${sub}</div></div>`}).join('')}
    <button class="add-tile" onclick="openGoal()">＋ เป้าหมายใหม่</button></div>`;
  if(!S.goals.length)h+=`<div class="note" style="margin-top:14px">ตั้งเป้าหมายร่วมกัน เช่น เที่ยวญี่ปุ่น ดาวน์บ้าน แต่งงาน หรือเงินสำรองฉุกเฉิน 6 เดือน แล้วกดเติมเงินทุกครั้งที่ออม</div>`;
  else h+=`<div class="note" style="margin-top:14px">ดูแผนรวมว่าต้องออมเดือนละเท่าไหร่ได้ที่ <a class="link" onclick="goPlan('forecast')" style="font-size:12.5px">วางแผน › แผน</a></div>`;
  document.getElementById('goalsBody').innerHTML=h;
}
function quickEmergency(){const h0=hist(3);const em=Math.round((h0.exp||0)*(+S.settings.emMonths||6)/1000)*1000;
  openGoal(null,{name:'เงินสำรองฉุกเฉิน',target:em||60000,e:'🛡️',color:5})}
function monthsUntil(ds){const d=new Date(ds+'T00:00:00'),n=new Date();return (d.getFullYear()-n.getFullYear())*12+(d.getMonth()-n.getMonth())+(d.getDate()>=n.getDate()?0:-1)+1}

    <div class="mini" style="margin:-4px 2px 10px">${UI.strat==='avalanche'?'Avalanche: โปะหนี้ดอกเบี้ยสูงสุดก่อน — เสียดอกเบี้ยรวมน้อยที่สุด':'Snowball: ปิดหนี้ก้อนเล็กก่อน — เห็นผลเร็ว มีกำลังใจ'}</div>
    <div class="group"><div class="field"><label style="width:auto;flex:1">โปะเพิ่มต่อเดือน</label><input type="number" inputmode="decimal" id="extraIn" value="${UI.extra||''}" placeholder="0" style="max-width:130px"></div></div>
    <div class="chips in" id="extraChips">${[0,500,1000,2000,5000].map(v=>`<button data-v="${v}" class="${(+UI.extra||0)===v?'on':''}">${v?'+'+fmtK(v):'ไม่โปะ'}</button>`).join('')}</div>
    ${sim.never?`<div class="note" style="color:var(--bad)">⚠️ ยอดผ่อนรวมยังไม่พอจ่ายดอกเบี้ย หนี้จะไม่ลดลง — ลองเพิ่มยอดโปะ หรือตรวจยอดผ่อนขั้นต่ำ</div>`:`

    ${UI.extra>0&&base&&!base.never?`<div class="note" style="margin:10px 2px 0">💡 โปะเพิ่ม ${fmt(UI.extra)}/เดือน ช่วยให้หมดหนี้เร็วขึ้น <b>${base.months-sim.months} เดือน</b> และประหยัดดอกเบี้ย <b>${fmt(base.interest-sim.interest)}</b></div>`:''}
    ${alt&&!alt.never&&Math.abs(alt.interest-sim.interest)>1?`<div class="note" style="margin:6px 2px 0">เทียบอีกวิธี: ${alt.interest>sim.interest?`วิธีนี้ประหยัดดอกเบี้ยกว่า ${fmt(alt.interest-sim.interest)}`:`อีกวิธีประหยัดดอกเบี้ยกว่า ${fmt(sim.interest-alt.interest)}`}</div>`:''}
    <div class="lineC" id="debtC" style="margin-top:10px"></div>

function picked(id,attr){const el=document.querySelector('#'+id+' .on');return el?el.getAttribute(attr):null}

function templates(type){const m={};S.tx.filter(t=>t.type===type&&t.note&&!t.bill&&!t.debt).forEach(t=>{const k=t.note.trim()+'|'+t.cat;const o=m[k]=m[k]||{note:t.note.trim(),cat:t.cat,who:t.who,amount:t.amount,n:0,ts:0};o.n++;if((t.ts||0)>=o.ts){o.ts=t.ts||0;o.amount=t.amount;o.who=t.who}});
  return Object.values(m).sort((a,b)=>b.n-a.n||b.ts-a.ts).slice(0,8)}

let KP=null;
document.addEventListener('keydown',e=>{if(!KP)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  const m={'Backspace':'del','Enter':'ok','-':'-','+':'+','*':'*','x':'*','.':'.'};const k=/^[0-9]$/.test(e.key)?e.key:m[e.key];if(k){e.preventDefault();KP(k)}});
function openTx(id,forceType,again){
  const t=id?S.tx.find(x=>x.id===id):null;
  let type=t?t.type:(forceType||'expense'), cat=t?t.cat:null, expr=t?String(t.amount):'', date=t?t.date:(again&&again.date)||todayStr();
  const tpl={expense:templates('expense'),income:templates('income')};
  const html=`<div class="seg-c" id="tType"><button type="button" data-v="expense"><span class="segi">${I('up',15)}รายจ่าย</span></button><button type="button" data-v="income"><span class="segi">${I('down',15)}รายรับ</span></button></div>
  <div class="amt-disp"><div class="expr" id="exprL">&nbsp;</div><div class="amt-big num" id="amtL">฿0</div></div>
  <div class="sugg" id="sugg"></div>
  <div class="cat-row" id="catRow"></div>
  <div class="hintB" id="bHint"></div>
  ${whoPicker(t?t.who:(again&&again.who)||'a')}
  <div class="date-row" id="dateRow"><button type="button" data-d="0">วันนี้</button><button type="button" data-d="1">เมื่อวาน</button>
    <label class="dpick">${I('calendar',16)}<span id="dLbl"></span><input type="date" id="dIn" value="${date}"></label></div>
  <div class="note-in" style="color:var(--muted)">${I('pencil',18)}<input id="nIn" placeholder="โน้ต เช่น ข้าวเย็น #ทริปเชียงใหม่" maxlength="80" value="${esc(t?t.note:'')}"></div>
  ${t?`<div style="display:flex;gap:8px;margin:10px 0"><button class="btn ghost full" id="dupTx">⧉ ทำซ้ำเป็นวันนี้</button><button class="btn danger full" id="delTx">ลบ</button></div>`:`<button class="btn ghost full" id="saveMore" style="margin:10px 0">บันทึก แล้วเพิ่มรายการต่อ</button>`}
  ${t&&t.bill?'<div class="note" style="text-align:center">🔁 รายการนี้มาจากรายการประจำ</div>':''}
  <div class="keypad" id="kp">${['1','2','3','+','4','5','6','-','7','8','9','del','.','0','*','ok'].map(k=>`<button type="button" data-k="${k}" class="${k==='ok'?'ok':/[+\-*]|del/.test(k)?'op':''}">${k==='del'?'⌫':k==='ok'?'✓':k==='-'?'−':k==='*'?'×':k}</button>`).join('')}</div>`;
  const doSave=async()=>{
    const amt=evalAmt(expr);
    if(!(amt>0)){toast('กรอกจำนวนเงินก่อนนะ');shake();return false}
    const o={id:t?t.id:uid(),type,amount:amt,cat,who:picked('whoP','data-w')||'a',date,note:document.getElementById('nIn').value.trim(),ts:t?t.ts:Date.now()};
    if(t&&t.bill)o.bill=t.bill; if(t&&t.debt)o.debt=t.debt;
    await write('tx',o);toast((t?'อัปเดตแล้ว ✓ ':'บันทึกแล้ว ✓ ')+(type==='income'?'+':'−')+fmt(amt));
    if(!t&&o.date.slice(0,7)!==UI.month){UI.month=o.date.slice(0,7);render()}
    return o;
  };
  openSheet(t?'แก้ไขรายการ':'บันทึกรายการ',html,doSave);
  const $=i=>document.getElementById(i);
  const shake=()=>{const el=$('amtL');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')};
  const hint=()=>{const el=$('bHint');const bg=+(S.settings.budgets||{})[cat]||0;
    if(type!=='expense'||!bg){el.classList.remove('on');return}
    const sp=catTotals(txOf(date.slice(0,7)))[cat]||0;const cur=t&&t.cat===cat&&t.date.slice(0,7)===date.slice(0,7)?+t.amount:0;
    const left=bg-sp+cur-(evalAmt(expr)||0);
    el.innerHTML=`<span class="hic" style="background:${CAT[cat].c}">${I(cat,14)}</span> งบ${CAT[cat].name}เดือนนี้ ${left>=0?`เหลือ <b>${fmt(left)}</b> หลังรายการนี้`:`<span class="over">จะเกินงบ ${fmt(-left)}</span>`}`;el.classList.add('on')};
  const drawAmt=()=>{const v=evalAmt(expr);$('amtL').textContent=fmt(v>0?v:0,(v%1)!==0);
    $('amtL').style.color=type==='income'?'#1E9E50':'var(--ink)';
    $('exprL').textContent=/[+\-*]/.test(expr)?expr.replace(/-/g,' − ').replace(/\+/g,' + ').replace(/\*/g,' × '):' ';hint()};
  const drawSugg=()=>{const tp=tpl[type];$('sugg').innerHTML=tp.slice(0,8).map((x,i)=>`<button type="button" data-i="${i}">${CAT[x.cat]?.e||''} ${esc(x.note)} · ${fmtK(x.amount)}</button>`).join('')};
  const drawCats=()=>{const cats=type==='expense'?EXP:INC;if(!cats.some(c=>c.id===cat))cat=cats[0].id;
    $('catRow').innerHTML=cats.map(c=>`<button type="button" class="cchip ${c.id===cat?'on':''}" data-c="${c.id}" style="--c:${c.c}"><span class="ic" style="background:${c.c}">${ci(c)}</span>${c.name}</button>`).join('');
    document.querySelectorAll('#tType button').forEach(b=>b.classList.toggle('on',b.dataset.v===type));drawSugg();drawAmt();
    const on=$('catRow').querySelector('.on');if(on&&t)on.scrollIntoView({inline:'center',block:'nearest'})};
  const drawDate=()=>{$('dLbl').textContent=dateLabel(date);const y=new Date();y.setDate(y.getDate()-1);const ys=dstr(y);
    document.querySelectorAll('#dateRow [data-d]').forEach(b=>b.classList.toggle('on',(b.dataset.d==='0'&&date===todayStr())||(b.dataset.d==='1'&&date===ys)));
    document.querySelector('#dateRow .dpick').classList.toggle('on',date!==todayStr()&&date!==ys);hint()};
  const press=k=>{
    const cur=expr.split(/[+\-*]/).pop();
    if(k==='ok'){$('shSave').click();return}
    if(k==='del')expr=expr.slice(0,-1);
    else if(/[+\-*]/.test(k)){if(!expr)return;expr=/[+\-*]$/.test(expr)?expr.slice(0,-1)+k:expr+k}
    else if(k==='.'){if(cur.includes('.'))return;expr+=cur?'.':'0.'}
    else{if(expr.length>=18||/\.\d\d$/.test(cur))return;if(cur==='0')expr=expr.slice(0,-1);expr+=k}
    if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
    drawAmt()};
  KP=press;
  $('kp').onclick=e=>{const b=e.target.closest('[data-k]');if(b)press(b.dataset.k)};
  $('tType').onclick=e=>{const b=e.target.closest('button');if(b){type=b.dataset.v;drawCats()}};
  $('catRow').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;document.querySelectorAll('#catRow .cchip').forEach(x=>x.classList.toggle('on',x===b));hint()};
  $('dateRow').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const d=new Date();d.setDate(d.getDate()-(+b.dataset.d));date=dstr(d);$('dIn').value=date;drawDate()};
  $('dIn').onchange=e=>{if(e.target.value){date=e.target.value;drawDate()}};
  $('sugg').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const x=tpl[type][+b.dataset.i];
    cat=x.cat;$('nIn').value=x.note;if(!(evalAmt(expr)>0))expr=String(x.amount);setPick('whoP','data-w',x.who||'a');drawCats()};
  bindPick('whoP','data-w');
  if(t){
    $('delTx').onclick=async()=>{if(await confirmDlg('ลบรายการนี้?','ลบแล้วกู้คืนไม่ได้')){closeSheet();await remove('tx',t.id);
      if(t.bill){const b=S.bills.find(x=>x.id===t.bill);if(b&&b.paid){const mk=Object.keys(b.paid).find(k=>b.paid[k]===t.id);if(mk){const nb=JSON.parse(JSON.stringify(b));delete nb.paid[mk];await write('bills',nb)}}}
      toast('ลบแล้ว')}};
    $('dupTx').onclick=async()=>{const o=Object.assign({},t,{id:uid(),date:todayStr(),ts:Date.now()});delete o.bill;delete o.debt;closeSheet();await write('tx',o);toast('ทำซ้ำเป็นวันนี้แล้ว ✓')};
  }else{
    $('saveMore').onclick=async()=>{const o=await doSave();if(o){closeSheet();setTimeout(()=>openTx(null,type,{who:o.who,date:o.date}),250)}};
  }
  drawCats();drawDate();
}

function openBudget(){
  const b=S.settings.budgets||{};const ca=catAvg(3),h0=hist(3);
  const html=`<div class="note">ตั้งงบต่อเดือนของแต่ละหมวด (เว้นว่าง = ไม่ตั้งงบ) ใช้ร่วมกันทั้งคู่ทุกเดือน</div>
  <div class="glabel">ตัวช่วยตั้งงบ</div>
  <div class="chips in" id="autoB"><button type="button" data-a="avg">📊 ตามค่าเฉลี่ย 3 เดือน</button><button type="button" data-a="avg90">✂️ ลด 10% จากค่าเฉลี่ย</button><button type="button" data-a="503020">⚖️ 50/30/20 จากรายรับ</button><button type="button" data-a="clear">ล้าง</button></div>
  <div class="group">${EXP.map(c=>`<div class="field"><span class="ic" style="background:${c.c};width:30px;height:30px;font-size:15px;border-radius:9px">${ci(c)}</span><label style="width:auto;flex:1">${c.name}<span class="mini" style="display:block">เฉลี่ย ${fmt(ca[c.id]||0)}</span></label><input type="number" inputmode="decimal" min="0" data-b="${c.id}" placeholder="—" value="${b[c.id]||''}" style="max-width:110px"></div>`).join('')}</div>
  <div class="note" id="bSum"></div>`;
  openSheet('งบประมาณรายเดือน',html,async()=>{
    const nb={};document.querySelectorAll('[data-b]').forEach(i=>{const v=parseFloat(i.value);if(v>0)nb[i.dataset.b]=v});
    S.settings=Object.assign({},S.settings,{budgets:nb});await saveSettings();toast('บันทึกงบแล้ว ✓');
  });
  const upd=()=>{let s=0;document.querySelectorAll('[data-b]').forEach(i=>s+=parseFloat(i.value)||0);
    document.getElementById('bSum').innerHTML='งบรวม <b>'+fmt(s)+'</b> ต่อเดือน'+(h0.inc?` · คิดเป็น ${Math.round(s/h0.inc*100)}% ของรายรับเฉลี่ย (${fmt(h0.inc)}) → เหลือออม ~${fmt(h0.inc-s)}`:'')};
  document.getElementById('shBody').addEventListener('input',upd);upd();
  const r100=v=>v>0?Math.ceil(v/100)*100:'';
  document.getElementById('autoB').onclick=e=>{const bt=e.target.closest('button');if(!bt)return;const a=bt.dataset.a;
    const set=(id,v)=>{const i=document.querySelector(`[data-b="${id}"]`);if(i)i.value=v};
    if(a==='clear')EXP.forEach(c=>set(c.id,''));
    if(a==='avg'||a==='avg90'){const f=a==='avg'?1:.9;EXP.forEach(c=>set(c.id,r100((ca[c.id]||0)*f)))}
    if(a==='503020'){if(!h0.inc){toast('ยังไม่มีข้อมูลรายรับ');return}
      const grp=(ids,share)=>{const tot=ids.reduce((s,k)=>s+(ca[k]||0),0);ids.forEach(k=>set(k,r100(tot?h0.inc*share*(ca[k]||0)/tot:h0.inc*share/ids.length)))};
      grp(NEEDS,.5);grp(WANTS,.3)}
    upd();toast('กรอกตัวเลขให้แล้ว ปรับได้ก่อนกดบันทึก')};
}
