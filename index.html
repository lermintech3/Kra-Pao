<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F2F7">
<title>กระเป๋าเงินของเรา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --ink2:#3C3C43; --muted:#8E8E93; --sep:rgba(60,60,67,.12);
  --fill:rgba(118,118,128,.12); --blue:#007AFF; --orange:#FF8A00; --pink:#FF2D55; --teal:#20A8C0;
  --purple:#AF52DE; --green:#30C26A; --indigo:#5856D6; --gold:#D9A400; --red:#FF3B30;
  --good:#1E9E50; --bad:#E0262B;
  --r:22px; --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}input[type=number]{-moz-appearance:textfield}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;padding:calc(var(--st) + 10px) 16px calc(var(--sb) + 110px)}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 2px}
.hello{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:uppercase}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:2px 2px 12px;line-height:1.15}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .15s}
.icon-btn:active{transform:scale(.9)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--card);padding:6px 10px;border-radius:99px;box-shadow:var(--shadow)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--good)} .dot.warn{background:#F5A400} .dot.err{background:var(--bad)}
/* month switch */
.month{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:6px;box-shadow:var(--shadow);margin-bottom:14px}
.month b{font-size:16px;font-weight:700}
.month button{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--blue);font-size:20px}
.month button:active{background:var(--fill)}
/* cards */
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3 small{font-size:13px;font-weight:500;color:var(--muted)}
.link{color:var(--blue);font-size:15px;font-weight:600}
.hero{position:relative;overflow:hidden;color:#fff;border-radius:28px;padding:20px;margin-bottom:14px;
  background:linear-gradient(135deg,#FF2D55 0%,#FF6A3D 35%,#AF52DE 75%,#5856D6 100%);box-shadow:0 14px 34px rgba(175,82,222,.35)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14)}
.hero:before{width:220px;height:220px;right:-70px;top:-90px}
.hero:after{width:140px;height:140px;left:-40px;bottom:-70px}
.hero .lbl{font-size:14px;opacity:.9;font-weight:600}
.hero .amt{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:4px 0 14px;line-height:1.1}
.hero .row{display:flex;gap:10px;position:relative;z-index:1}
.chip{flex:1;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:10px 12px}
.chip span{display:block;font-size:12px;opacity:.9}
.chip b{font-size:17px}
.rate{position:relative;z-index:1;margin-top:12px;font-size:13px;opacity:.95}
.rate .bar{height:8px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:6px;overflow:hidden}
.rate .bar i{display:block;height:100%;border-radius:9px;background:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{border-radius:20px;padding:14px;color:#fff;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.tile span{font-size:12.5px;font-weight:600;opacity:.92}
.tile b{font-size:21px;font-weight:800;letter-spacing:-.01em}
.tile em{font-style:normal;font-size:11.5px;opacity:.9}
.g1{background:linear-gradient(145deg,#0A84FF,#5E5CE6)}
.g2{background:linear-gradient(145deg,#FF9F0A,#FF375F)}
.g3{background:linear-gradient(145deg,#30D158,#00A6A6)}
.g4{background:linear-gradient(145deg,#BF5AF2,#FF2D92)}
/* list rows */
.row-i{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--sep)}
.row-i:last-child{border-bottom:0}
.row-i.tap{cursor:pointer;border-radius:12px;transition:background .15s}
.row-i.tap:active{background:var(--fill)}
.ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;color:#fff}
.grow{flex:1;min-width:0}
.t1{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amtR{font-weight:700;font-size:15.5px;text-align:right;white-space:nowrap}
.inc{color:var(--good)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--fill);color:var(--ink2)}
.swatch{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
/* donut */
.donut-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{position:relative;width:150px;height:150px;flex:none}
.donut svg{width:150px;height:150px;transform:rotate(-90deg)}
.donut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:28px}
.donut .ctr span{font-size:11.5px;color:var(--muted)}
.donut .ctr b{font-size:17px;font-weight:800}
.donut circle.seg{cursor:pointer;transition:stroke-width .2s}
.legend{flex:1 1 230px;min-width:0}
.lg{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 6px;border-radius:8px;cursor:pointer}
.lg.on{background:var(--fill)}
.lg .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.lg .v{font-weight:700}
.lg .p{color:var(--muted);width:36px;text-align:right;font-size:12px}
/* split */
.split{display:flex;height:14px;border-radius:9px;overflow:hidden;gap:2px;background:var(--card)}
.split i{display:block;height:100%}
.split i:first-child{border-radius:9px 0 0 9px}.split i:last-child{border-radius:0 9px 9px 0}
.splitL{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.splitL div{background:var(--bg);border-radius:14px;padding:10px}
.splitL span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.splitL b{display:block;font-size:15px;margin-top:3px}
/* bar chart */
.bars{position:relative}
.bars svg{width:100%;height:190px;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:rgba(28,28,30,.92);color:#fff;font-size:12px;padding:8px 10px;border-radius:12px;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .15s;z-index:3}
.tip.show{opacity:1}
.keys{display:flex;gap:14px;font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.keys span{display:inline-flex;align-items:center;gap:6px}
/* insights */
.ins{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.ins .e{font-size:20px;line-height:1.2}
.ins p{margin:0;font-size:14px;color:var(--ink2);line-height:1.45}
/* segmented */
.seg-c{display:flex;background:var(--fill);border-radius:11px;padding:2px;margin-bottom:12px}
.seg-c button{flex:1;padding:7px 4px;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);transition:all .2s}
.seg-c button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.search input{flex:1;border:0;background:none;outline:none;font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 13px;border-radius:99px;background:var(--card);font-size:13.5px;font-weight:600;box-shadow:var(--shadow)}
.chips button.on{background:var(--ink);color:#fff}
.dayh{font-size:13px;color:var(--muted);font-weight:600;margin:14px 6px 6px;display:flex;justify-content:space-between}
/* budget */
.pb{height:10px;border-radius:9px;background:var(--fill);overflow:hidden;margin-top:7px}
.pb i{display:block;height:100%;border-radius:9px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.over{color:var(--bad);font-weight:700}
.ring-wrap{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{width:120px;height:120px;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ctr b{font-size:24px;font-weight:800}
.ring .ctr span{font-size:11px;color:var(--muted)}
.kv{font-size:14px;color:var(--ink2);line-height:1.8}
.kv b{color:var(--ink)}
/* goals */
.goals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.goal{border-radius:22px;padding:14px;color:#fff;position:relative;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.goal:active{transform:scale(.97)}
.goal .em{font-size:28px}
.goal .nm{font-weight:700;font-size:15px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .sv{font-size:12.5px;opacity:.95;margin-top:2px}
.goal .gb{height:7px;border-radius:9px;background:rgba(255,255,255,.3);margin-top:10px;overflow:hidden}
.goal .gb i{display:block;height:100%;background:#fff;border-radius:9px}
.goal .pc{position:absolute;right:12px;top:12px;font-weight:800;font-size:15px}
.add-tile{border:2px dashed rgba(60,60,67,.2);border-radius:22px;display:grid;place-items:center;min-height:140px;color:var(--muted);font-weight:600;font-size:14px;background:transparent}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty .e{font-size:44px}
.empty p{margin:8px 0 14px;font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:14px;font-weight:700;font-size:16px;background:var(--blue);color:#fff;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.full{width:100%}
.btn.grad{background:linear-gradient(135deg,#FF2D55,#AF52DE)}
.btn.ghost{background:var(--fill);color:var(--blue)}
.btn.danger{background:rgba(255,59,48,.12);color:var(--red)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:11px}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(var(--sb) + 8px);pointer-events:none}
.tabin{max-width:520px;margin:0 auto;pointer-events:auto;display:flex;align-items:center;justify-content:space-around;
  background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
  border-radius:28px;padding:8px 6px;box-shadow:0 10px 30px rgba(0,0,0,.12),inset 0 0 0 .5px rgba(0,0,0,.06)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);width:64px;padding:4px 0;border-radius:16px}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--pink)}
.fab{width:56px;height:56px;border-radius:50%;margin-top:-26px;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:400;
  background:conic-gradient(from 200deg,#FF2D55,#FF8A00,#FFCC00,#30C26A,#20A8C0,#007AFF,#AF52DE,#FF2D55);box-shadow:0 10px 24px rgba(255,45,85,.4);transition:transform .15s}
.fab span{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#FF2D55,#AF52DE)}
.fab:active{transform:scale(.9) rotate(90deg)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;background:var(--bg);border-radius:26px 26px 0 0;
  transform:translateY(105%);visibility:hidden;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s .42s;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.sheet.on{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.2,.9,.2,1),visibility 0s}
.grab{width:38px;height:5px;border-radius:9px;background:rgba(60,60,67,.3);margin:8px auto 2px}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 10px}
.sh-head b{font-size:17px}
.sh-head button{color:var(--blue);font-size:16px;font-weight:600;min-width:60px;text-align:left}
.sh-head button:last-child{text-align:right}
.sh-body{overflow-y:auto;padding:4px 16px calc(var(--sb) + 20px);-webkit-overflow-scrolling:touch}
.group{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:14px}
.field{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:.5px solid var(--sep);min-height:48px}
.field:last-child{border-bottom:0}
.field label{font-size:15.5px;width:96px;flex:none;color:var(--ink)}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;outline:none;background:none;font-size:16px;text-align:right;color:var(--ink2)}
.field textarea{text-align:left;resize:none}
.glabel{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:4px 14px 6px}
.amount-box{text-align:center;padding:10px 0 16px}
.amount-box .cur{font-size:28px;font-weight:700;color:var(--muted);vertical-align:top;margin-right:2px}
.amount-box input{border:0;outline:none;background:none;font-size:46px;font-weight:800;width:72%;text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 2px;border-radius:16px;background:var(--card);font-size:11.5px;font-weight:600;color:var(--ink2);transition:transform .12s;border:2px solid transparent}
.cat .ic{width:42px;height:42px}
.cat.on{border-color:var(--ink);color:var(--ink)}
.cat:active{transform:scale(.94)}
.who{display:flex;gap:8px;margin-bottom:14px}
.who button{flex:1;background:var(--card);border-radius:14px;padding:10px 4px;font-weight:600;font-size:14px;border:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.who button .e{font-size:22px}
.who button.on{border-color:var(--ink)}
/* toast & dialog */
.toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translate(-50%,-140%);background:rgba(28,28,30,.92);color:#fff;padding:11px 16px;border-radius:16px;font-size:14px;font-weight:600;z-index:60;transition:transform .35s cubic-bezier(.2,.9,.2,1);max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
.dlg{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.3)}
.dlg.on{display:flex}
.dlg .box{width:280px;background:rgba(245,245,247,.96);backdrop-filter:blur(20px);border-radius:16px;overflow:hidden;text-align:center;animation:pop .25s}
@keyframes pop{from{transform:scale(1.15);opacity:0}to{transform:none;opacity:1}}
.dlg .box h4{margin:18px 16px 4px;font-size:17px}
.dlg .box p{margin:0 16px 16px;font-size:13.5px;color:var(--ink2)}
.dlg .acts{display:flex;border-top:.5px solid var(--sep)}
.dlg .acts button{flex:1;padding:12px;font-size:17px;color:var(--blue)}
.dlg .acts button+button{border-left:.5px solid var(--sep);font-weight:600}
.dlg .acts button.red{color:var(--red)}
.view{display:none;animation:fade .3s}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.note{font-size:12.5px;color:var(--muted);line-height:1.5;margin:6px 6px 14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
table.tv{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
table.tv td,table.tv th{padding:6px 4px;border-bottom:.5px solid var(--sep);text-align:right}
table.tv td:first-child,table.tv th:first-child{text-align:left}
details summary{font-size:13px;color:var(--blue);cursor:pointer;margin-top:10px;font-weight:600}
/* ===== v2 additions ===== */
.tab{width:62px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.qa button{background:var(--card);border-radius:18px;padding:12px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink2);box-shadow:var(--shadow);transition:transform .12s}
.qa button:active{transform:scale(.94)}
.qa .ic{width:40px;height:40px;font-size:19px;border-radius:13px}
.tile.tap{cursor:pointer;transition:transform .12s}.tile.tap:active{transform:scale(.97)}
.g5{background:linear-gradient(145deg,#FF2D55,#FF8A00)}
.g6{background:linear-gradient(145deg,#5E5CE6,#BF5AF2)}
.pb{position:relative}
.pb .mk{position:absolute;top:0;bottom:0;width:2px;background:rgba(28,28,30,.55);border-radius:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal .d{aspect-ratio:1/1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12.5px;font-weight:600;background:var(--bg);color:var(--ink);cursor:pointer;min-width:0}
.cal .d.x{background:transparent;cursor:default}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .d small{font-size:9.5px;font-weight:800;line-height:1}
.cal .d small.ok{color:var(--good)}.cal .d small.bad{color:var(--bad)}.cal .d small.due{color:var(--ink2)}
.hm-l{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);justify-content:flex-end;margin-top:10px}
.hm-l i{width:14px;height:14px;border-radius:4px;display:inline-block}
.fac{padding:10px 0;border-bottom:.5px solid var(--sep)}.fac:last-child{border-bottom:0}
.fac .fh{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:600}
.fac .fh .v{margin-left:auto;font-weight:700}
.fac p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.tag{display:inline-block;font-size:11px;color:var(--blue);font-weight:700;margin-left:4px}
.sw{width:51px;height:31px;border-radius:99px;background:rgba(120,120,128,.24);position:relative;flex:none;transition:background .2s;margin-left:auto}
.sw.on{background:#34C759}
.sw:after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.sw.on:after{left:22px}
.stack{display:flex;height:16px;border-radius:9px;overflow:hidden;gap:2px;background:var(--card)}
.stack i{display:block;height:100%}
.kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.cta{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);margin-bottom:14px;cursor:pointer;width:100%;text-align:left}

.cta .t1{white-space:normal}
.cta .t2{white-space:normal}

.seg-c.sm button{font-size:12.5px;padding:7px 2px}
.planM{margin-bottom:14px}

/* ===== quick entry (iOS keypad) ===== */
.amt-disp{text-align:center;padding:4px 0 8px}
.amt-disp .expr{font-size:14px;color:var(--muted);min-height:18px;font-variant-numeric:tabular-nums}

.shake{animation:shk .35s}

.cat-row{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}

.cchip{flex:none;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;padding:8px 2px;border-radius:16px;background:var(--card);font-size:11px;font-weight:600;color:var(--ink2);border:2px solid transparent;transition:transform .12s}
.cchip .ic{width:40px;height:40px;font-size:20px}
.cchip.on{border-color:var(--c);color:var(--ink);box-shadow:0 6px 14px rgba(0,0,0,.08)}

.dpick{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;flex:1.4!important;cursor:pointer;white-space:nowrap;overflow:hidden}

.note-in{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.note-in input{flex:1;border:0;outline:none;background:none;font-size:16px}

.keypad{position:sticky;bottom:calc(-1*(var(--sb) + 20px));display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px -16px calc(-1*(var(--sb) + 20px));padding:10px 12px calc(var(--sb) + 14px);

.eye{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--fill)}
.mini-m{display:flex;align-items:center;gap:2px;background:var(--fill);border-radius:99px;padding:2px}

.bal-amt{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:6px 0 12px;line-height:1.1}

.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io div{border-radius:16px;padding:10px 12px;background:var(--bg)}

.qa button .ic{box-shadow:0 6px 14px rgba(0,0,0,.12)}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 14px;padding:2px 16px 6px;scrollbar-width:none}

const EXP = [

const INC = [

function attach(db){
  DB=db;
  const need=COLS.length+1, got={};
  setSync('warn','กำลังเชื่อมต่อ…');
  const timer=setTimeout(()=>{ if(Object.keys(got).length<need) setSync('err','ยังเชื่อมต่อไม่ได้') },10000);
  const done=(k,snap)=>{ if(!snap.metadata.fromCache) got[k]=1; if(Object.keys(got).length>=need){clearTimeout(timer);setSync('ok','ซิงค์แล้ว')} };
  const onErr=e=>{clearTimeout(timer);
    if(e&&e.code==='permission-denied'){setSync('err','ไม่มีสิทธิ์');toast('อีเมลนี้ยังไม่ได้รับสิทธิ์ — เพิ่มอีเมลใน Firestore Rules ก่อน')}
    else setSync('err', e&&e.code==='revoked'?'ออฟไลน์':'ซิงค์ไม่ได้')};
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      S[c]=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
      done(c,snap); cacheLocal(); render();
    },onErr);
  });
  db.doc('meta/settings').onSnapshot(snap=>{
    if(snap.exists){const d=snap.data();S.settings=Object.assign({},DEF_SETTINGS,JSON.parse(JSON.stringify(d)))}

  },onErr);
}

function txOf(k){return S.tx.filter(t=>(t.date||'').slice(0,7)===k)}
function sumAmt(a){return a.reduce((s,x)=>s+(+x.amount||0),0)}
function sumBy(list,type){return sumAmt(list.filter(t=>t.type===type))}
function catTotals(list){const m={};list.filter(t=>t.type==='expense').forEach(t=>{m[t.cat]=(m[t.cat]||0)+(+t.amount||0)});return m}
function budgetTotal(){const b=S.settings.budgets||{};return EXP.reduce((s,c)=>s+(+b[c.id]||0),0)}
function billType(b){return b.type==='income'?'income':'expense'}
function recur(type){return S.bills.filter(b=>billType(b)===type)}
function isPaid(b,mk){return !!(b.paid&&b.paid[mk])}
function debtPaidIn(d,mk){return (d.log||[]).some(l=>(l.d||'').slice(0,7)===mk&&l.a>0)}
function saveTarget(){return +S.settings.saveTarget||20}
function isEmergency(g){return g.e==='🛡️'||/ฉุกเฉิน|สำรอง/.test(g.name||'')}
/* average of the last n complete months that have data */
function hist(n){n=n||3;const base=monthKey(new Date());let I=0,E=0,c=0;
  for(let i=1;i<=n;i++){const l=txOf(shiftMonth(base,-i));if(!l.length)continue;I+=sumBy(l,'income');E+=sumBy(l,'expense');c++}
  const ri=sumAmt(recur('income')),re=sumAmt(recur('expense'));
  if(!c){const l=txOf(base),dn=new Date().getDate(),dim=daysIn(base);const e=sumBy(l,'expense');
    return {inc:Math.max(sumBy(l,'income'),ri),exp:Math.max(e/Math.max(dn,10)*dim,e,re),n:0}}
  return {inc:(I/c)||ri,exp:E/c,n:c}}
function catAvg(n){n=n||3;const base=monthKey(new Date());const m={};let c=0;
  for(let i=1;i<=n;i++){const l=txOf(shiftMonth(base,-i));if(!l.length)continue;c++;const ct=catTotals(l);for(const k in ct)m[k]=(m[k]||0)+ct[k]}
  if(!c){return catTotals(txOf(base))}
  for(const k in m)m[k]/=c;return m}
/* current-month outlook: safe-to-spend & month-end projection */
function outlook(){
  const now=new Date(),mk=monthKey(now),l=txOf(mk),dn=now.getDate(),dim=daysIn(mk),left=dim-dn+1;
  const inc=sumBy(l,'income'),exp=sumBy(l,'expense');
  const unpaidExp=sumAmt(recur('expense').filter(b=>!isPaid(b,mk)));
  const pendInc=sumAmt(recur('income').filter(b=>!isPaid(b,mk)));
  const unpaidDebt=S.debts.filter(d=>+d.balance>0&&!debtPaidIn(d,mk)).reduce((s,d)=>s+Math.min(+d.min||0,+d.balance),0);
  const varExp=sumAmt(l.filter(t=>t.type==='expense'&&!t.bill&&!t.debt));
  const rate=varExp/Math.max(1,dn), projVar=rate*(dim-dn);
  const endBal=inc+pendInc-exp-unpaidExp-unpaidDebt-projVar;
  const budT=budgetTotal(), tg=saveTarget()/100;
  let pool,basis;
  if(budT){pool=budT-exp-unpaidExp-unpaidDebt;basis='คิดจากงบรวม หักที่ใช้แล้วและบิลที่ยังไม่จ่าย'}
  else{const ei=Math.max(inc+pendInc,hist(3).inc);pool=ei*(1-tg)-exp-unpaidExp-unpaidDebt;basis=`คิดจากรายรับ หลังกันเงินออม ${Math.round(tg*100)}% และบิลที่ยังไม่จ่าย`}
  return {mk,inc,exp,unpaidExp,pendInc,unpaidDebt,varExp,projVar,endBal,pool,perDay:Math.max(0,pool)/left,left,dn,dim,basis,budT,rate};
}
/* upcoming recurring items within N days (incl. overdue this month) */
function upcoming(days){days=days||7;const now=new Date(),out=[];const lim=new Date(now);lim.setDate(lim.getDate()+days);
  [0,1].forEach(off=>{const mk=shiftMonth(monthKey(now),off);const dim=daysIn(mk);
    S.bills.forEach(b=>{if(isPaid(b,mk))return;const d=new Date(+mk.slice(0,4),+mk.slice(5)-1,Math.min(b.day||1,dim));
      const late=off===0&&d.getDate()<now.getDate();if(d<=lim&&(late||d>=new Date(now.getFullYear(),now.getMonth(),now.getDate())))out.push({kind:billType(b),b,mk,date:dstr(d),late,amount:+b.amount,name:b.name,id:b.id});});
    S.debts.forEach(x=>{if(!(+x.balance>0)||!x.day||debtPaidIn(x,mk))return;const d=new Date(+mk.slice(0,4),+mk.slice(5)-1,Math.min(x.day,dim));
      const late=off===0&&d.getDate()<now.getDate();if(d<=lim&&(late||d>=new Date(now.getFullYear(),now.getMonth(),now.getDate())))out.push({kind:'debt',b:x,mk,date:dstr(d),late,amount:Math.min(+x.min||0,+x.balance),name:x.name,id:x.id});});
  });
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}

  const cur=monthKey(new Date()),d=new Date().getDate(),due=recur('expense').filter(x=>x.day<d),paid=due.filter(x=>isPaid(x,cur)).length;

/* debt payoff simulation */
function simDebts(strat,extra){
  const ds=S.debts.filter(d=>+d.balance>0).map(d=>({id:d.id,name:d.name,e:d.e,b:+d.balance,r:(+d.rate||0)/1200,m:+d.min||0}));
  if(!ds.length)return null;
  const sorter=strat==='snowball'?(a,b)=>a.b-b.b:(a,b)=>b.r-a.r||a.b-b.b;
  const order=[...ds].sort(sorter).map(d=>d.id);
  const budget=ds.reduce((s,d)=>s+d.m,0)+(+extra||0);
  let month=0,interest=0;const payoff={},series=[ds.reduce((s,d)=>s+d.b,0)];
  while(month<600&&ds.some(d=>d.b>0.01)){
    month++;let avail=budget;
    ds.forEach(d=>{if(d.b<=0.01)return;const i=d.b*d.r;interest+=i;d.b+=i});
    ds.forEach(d=>{if(d.b<=0.01)return;const p=Math.min(d.m,d.b,avail);d.b-=p;avail-=p});
    for(const d of [...ds].filter(x=>x.b>0.01).sort(sorter)){if(avail<=0)break;const p=Math.min(avail,d.b);d.b-=p;avail-=p}
    ds.forEach(d=>{if(d.b<=0.01&&!payoff[d.id])payoff[d.id]=month});
    const tot=ds.reduce((s,d)=>s+Math.max(0,d.b),0);series.push(tot);
    if(month>=3&&tot>=series[month-3]-0.01&&tot>0)return {never:true,order,budget};
  }
  return {months:month,interest,payoff,series,order,budget};
}

/* ================= amount expression (no eval) ================= */
function evalAmt(raw){let s=String(raw||'').replace(/,/g,'').replace(/[x×]/gi,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s/g,'');
  if(!s||!/^[\d.+\-*/]+$/.test(s))return NaN;let i=0;
  const num=()=>{const m=s.slice(i).match(/^(\d+\.?\d*|\.\d+)/);if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
  const term=()=>{let v=num();while(s[i]==='*'||s[i]==='/'){const o=s[i++];const n=num();v=o==='*'?v*n:v/n}return v};
  try{let v=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++];const n=term();v=o==='+'?v+n:v-n}
    if(i!==s.length)return NaN;return isFinite(v)?Math.round(v*100)/100:NaN}catch(e){return NaN}}

function insights(list,inc,exp,budT){
  const out=[]; const ct=catTotals(list); const isCur=UI.month===monthKey(new Date());
  const top=Object.entries(ct).sort((a,b)=>b[1]-a[1])[0];
  if(top&&exp)out.push([CAT[top[0]]?.e||'📦',`หมวดที่ใช้มากสุดคือ <b>${esc(CAT[top[0]]?.name)}</b> ${fmt(top[1])} (${Math.round(top[1]/exp*100)}% ของรายจ่าย)`]);
  const prev=txOf(shiftMonth(UI.month,-1)), pe=sumBy(prev,'expense');
  if(pe>0&&exp>0&&!isCur){const d=Math.round((exp-pe)/pe*100);out.push([d>0?'📈':'📉',`รายจ่าย${d>0?'มากกว่า':'น้อยกว่า'}เดือนก่อน <b>${Math.abs(d)}%</b> (${fmt(pe)} → ${fmt(exp)})`])}
  if(pe>0&&isCur){const dn=new Date().getDate();const pSame=sumBy(prev.filter(t=>+t.date.slice(8)<=dn),'expense');if(pSame>0){const d=Math.round((exp-pSame)/pSame*100);out.push([d>0?'📈':'📉',`เทียบช่วงเดียวกันเดือนก่อน (1–${dn}) ใช้${d>0?'มากกว่า':'น้อยกว่า'} <b>${Math.abs(d)}%</b>`])}}
  const b=S.settings.budgets||{};const over=EXP.filter(c=>+b[c.id]>0&&(ct[c.id]||0)>+b[c.id]);
  if(over.length)out.push(['⚠️',`เกินงบ: ${over.map(c=>`<b>${esc(c.name)}</b>`).join(', ')}`]);
  else if(isCur&&budT){const o=outlook();const fc=o.exp+o.unpaidExp+o.projVar;if(fc>budT)out.push(['🧭',`ถ้าใช้ในอัตรานี้ สิ้นเดือนจะเกินงบรวมประมาณ <b>${fmt(fc-budT)}</b>`])}
  if(isCur){const ca=catAvg(3);const dn=new Date().getDate(),dim=daysIn(UI.month);
    const spike=EXP.map(c=>({c,cur:ct[c.id]||0,avg:ca[c.id]||0})).filter(x=>x.avg>500&&x.cur>x.avg*1.15&&x.cur>x.avg*dn/dim*1.5).sort((a,b)=>(b.cur-b.avg)-(a.cur-a.avg))[0];
    if(spike)out.push(['🔎',`<b>${esc(spike.c.name)}</b> ใช้ไปแล้ว ${fmt(spike.cur)} สูงกว่าค่าเฉลี่ย 3 เดือน (${fmt(spike.avg)})`]);}
  if(inc>0){const r=(inc-exp)/inc;if(r*100>=saveTarget())out.push(['🌟',`ออมได้ ${Math.round(r*100)}% ของรายรับ ผ่านเป้า ${saveTarget()}% แล้ว`]);else if(r<0)out.push(['🚨',`รายจ่ายมากกว่ารายรับ ${fmt(exp-inc)}`]);}
  return out.slice(0,5);
}

function donutHTML(list,exp){
  if(!exp)return '<div class="empty" style="padding:10px"><p>ยังไม่มีรายจ่ายในเดือนนี้</p></div>';
  const ct=catTotals(list); const R=58, C=2*Math.PI*R, gap=2.5;
  let off=0, segs='';
  const items=EXP.filter(c=>ct[c.id]>0);
  items.forEach(c=>{const v=ct[c.id];const L=v/exp*C;const dl=Math.max(0.5,L-(items.length>1?gap:0));
    segs+=`<circle class="seg" data-cat="${c.id}" cx="75" cy="75" r="${R}" fill="none" stroke="${c.c}" stroke-width="22" stroke-dasharray="${dl} ${C-dl}" stroke-dashoffset="${-off}" stroke-linecap="butt"><title>${c.name} ${fmt(v)}</title></circle>`;off+=L});
  const leg=[...items].sort((a,b)=>ct[b.id]-ct[a.id]).map(c=>`<div class="lg" data-cat="${c.id}"><i class="swatch" style="background:${c.c}"></i><span class="n">${c.e} ${c.name}</span><span class="v num">${fmtK(ct[c.id])}</span><span class="p">${Math.round(ct[c.id]/exp*100)}%</span></div>`).join('');
  return `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--fill)" stroke-width="22"/>${segs}</svg><div class="ctr" id="dctr"><span>รวม</span><b class="num">${fmtK(exp)}</b></div></div><div class="legend">${leg}</div></div>`;
}
function bindDonut(){
  const list=txOf(UI.month), exp=sumBy(list,'expense'), ct=catTotals(list);
  const pick=id=>{
    document.querySelectorAll('.lg').forEach(e=>e.classList.toggle('on',e.dataset.cat===id));
    document.querySelectorAll('circle.seg').forEach(e=>e.setAttribute('stroke-width',e.dataset.cat===id?26:22));
    const ctr=document.getElementById('dctr');if(!ctr)return;
    if(!id){ctr.innerHTML=`<span>รวม</span><b class="num">${fmtK(exp)}</b>`;return}
    ctr.innerHTML=`<span>${CAT[id].e} ${CAT[id].name}</span><b class="num">${fmt(ct[id])}</b><span>${Math.round(ct[id]/exp*100)}%</span>`;
  };
  let cur=null;
  document.querySelectorAll('#homeBody [data-cat]').forEach(el=>{
    el.addEventListener('mouseenter',()=>pick(el.dataset.cat));
    el.addEventListener('mouseleave',()=>pick(cur));
    el.addEventListener('click',()=>{cur=cur===el.dataset.cat?null:el.dataset.cat;pick(cur)});
  });
}

/* ---------- charts ---------- */
function trendData(n){const out=[];for(let i=n-1;i>=0;i--){const k=shiftMonth(UI.month,-i);const l=txOf(k);out.push({k,inc:sumBy(l,'income'),exp:sumBy(l,'expense')})}return out}
function trendTable(n){const d=trendData(n);return `<details><summary>ดูเป็นตาราง</summary><table class="tv"><tr><th>เดือน</th><th>รายรับ</th><th>รายจ่าย</th><th>คงเหลือ</th></tr>${d.map(r=>`<tr><td>${monthYearShort(r.k)}</td><td class="num">${fmt(r.inc)}</td><td class="num">${fmt(r.exp)}</td><td class="num">${fmt(r.inc-r.exp)}</td></tr>`).join('')}</table></details>`}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1.5?1.5:n<=3?3:n<=6?6:10)*p}
function drawBars(id,n){
  const box=document.getElementById(id);if(!box)return;
  const d=trendData(n); const W=box.clientWidth||320, H=190, pl=34, pb=22, pt=10;
  const max=Math.max(1,...d.map(r=>Math.max(r.inc,r.exp)));
  const nice=niceMax(max); const gw=(W-pl)/d.length; const bw=Math.max(3,Math.min(16,(gw-(n>8?6:14))/2));
  const y=v=>pt+(H-pt-pb)*(1-v/nice);
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=3;i++){const v=nice*i/3;s+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(60,60,67,.1)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#8E8E93">${fmtK(v)}</text>`}
  const bar=(x,v,c)=>{const h=Math.max(0,y(0)-y(v));if(h<=0)return '';const r=Math.min(4,h,bw/2);const top=y(v);
    return `<path d="M${x},${y(0)} V${top+r} Q${x},${top} ${x+r},${top} H${x+bw-r} Q${x+bw},${top} ${x+bw},${top+r} V${y(0)} Z" fill="${c}"/>`};
  d.forEach((r,i)=>{const cx=pl+gw*i+gw/2;
    s+=bar(cx-bw-1,r.inc,'#007AFF')+bar(cx+1,r.exp,'#FF8A00');
    s+=`<text x="${cx}" y="${H-5}" text-anchor="middle" font-size="${n>8?9.5:11}" fill="${r.k===UI.month?'#1C1C1E':'#8E8E93'}" font-weight="${r.k===UI.month?700:400}">${monthName(r.k,true)}</text>`;
    s+=`<rect class="hit" data-i="${i}" x="${pl+gw*i}" y="0" width="${gw}" height="${H}" fill="transparent"/>`;
  });
  s+=`</svg><div class="tip"></div>`;
  box.innerHTML=s;
  const tip=box.querySelector('.tip');
  box.querySelectorAll('.hit').forEach(h=>{
    const show=()=>{const r=d[+h.dataset.i];const cx=pl+gw*(+h.dataset.i)+gw/2;
      tip.innerHTML=`<b>${monthName(r.k)}</b><br>รายรับ ${fmt(r.inc)}<br>รายจ่าย ${fmt(r.exp)}<br>คงเหลือ ${fmt(r.inc-r.exp)}`;
      tip.style.left=Math.min(W-70,Math.max(70,cx/W*box.clientWidth))+'px';tip.style.top=(y(Math.max(r.inc,r.exp))-6)+'px';tip.classList.add('show');
      box.querySelectorAll('.hit').forEach(o=>o.setAttribute('fill',o===h?'rgba(118,118,128,.08)':'transparent'))};
    h.addEventListener('mouseenter',show);h.addEventListener('click',show);
    h.addEventListener('mouseleave',()=>{tip.classList.remove('show');h.setAttribute('fill','transparent')});
  });
}
/* single-series line with optional labelled reference line */
function lineChart(id,pts,color,ref,tipFn){
  const box=document.getElementById(id);if(!box||!pts.length)return;
  const W=box.clientWidth||320,H=180,pl=40,pb=22,pt=16,pr=8;
  const vals=pts.map(p=>p.v),mx=Math.max(1,...vals,ref?ref.v:0),mn=Math.min(0,...vals);
  const top=niceMax(mx),lo=mn<0?-niceMax(-mn):0;
  const x=i=>pl+(W-pl-pr)*(pts.length<2?.5:i/(pts.length-1)),y=v=>pt+(H-pt-pb)*(1-(v-lo)/(top-lo));
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=3;i++){const v=lo+(top-lo)*i/3;s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(60,60,67,.1)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#8E8E93">${fmtK(v)}</text>`}
  if(lo<0)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="rgba(60,60,67,.35)"/>`;
  if(ref){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(ref.v)}" y2="${y(ref.v)}" stroke="#3C3C43" stroke-dasharray="4 4" stroke-width="1.2" opacity=".6"/><text x="${W-pr}" y="${y(ref.v)-5}" text-anchor="end" font-size="10.5" fill="#3C3C43" font-weight="600">${esc(ref.label)}</text>`}
  const line=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  s+=`<path d="${line} L${x(pts.length-1)},${y(Math.max(lo,0))} L${x(0)},${y(Math.max(lo,0))} Z" fill="${color}" opacity=".10"/>`;
  s+=`<path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const step=Math.ceil(pts.length/6);
  pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1)s+=`<text x="${x(i)}" y="${H-5}" text-anchor="${i===0?'start':i===pts.length-1?'end':'middle'}" font-size="10" fill="#8E8E93">${esc(p.label)}</text>`});

function simpleBars(id,items,color){
  const box=document.getElementById(id);if(!box)return;
  const W=box.clientWidth||320,H=170,pl=34,pb=22,pt=18;const mx=niceMax(Math.max(1,...items.map(i=>i.v)));
  const gw=(W-pl)/items.length,bw=Math.min(26,gw-12),y=v=>pt+(H-pt-pb)*(1-v/mx);
  const maxI=items.reduce((bi,it,i)=>it.v>items[bi].v?i:bi,0);
  let s=`<svg viewBox="0 0 ${W} ${H}">`;
  for(let i=0;i<=3;i++){const v=mx*i/3;s+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(60,60,67,.1)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#8E8E93">${fmtK(v)}</text>`}
  items.forEach((it,i)=>{const cx=pl+gw*i+gw/2,x0=cx-bw/2,h=Math.max(0,y(0)-y(it.v)),top=y(it.v),r=Math.min(4,h,bw/2);
    if(h>0)s+=`<path d="M${x0},${y(0)} V${top+r} Q${x0},${top} ${x0+r},${top} H${x0+bw-r} Q${x0+bw},${top} ${x0+bw},${top+r} V${y(0)} Z" fill="${color}"/>`;
    if(i===maxI&&it.v>0)s+=`<text x="${cx}" y="${top-5}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1C1C1E">${fmtK(it.v)}</text>`;
    s+=`<text x="${cx}" y="${H-5}" text-anchor="middle" font-size="11" fill="#8E8E93">${esc(it.label)}</text><rect class="hit" data-i="${i}" x="${pl+gw*i}" y="0" width="${gw}" height="${H}" fill="transparent"/>`});
  s+=`</svg><div class="tip"></div>`;box.innerHTML=s;const tip=box.querySelector('.tip');
  box.querySelectorAll('.hit').forEach(h=>{const show=()=>{const it=items[+h.dataset.i];const cx=pl+gw*(+h.dataset.i)+gw/2;
    tip.innerHTML=it.tip||`<b>${esc(it.label)}</b><br>${fmt(it.v)}`;tip.style.left=clamp(cx/W*box.clientWidth,70,box.clientWidth-70)+'px';tip.style.top=(y(it.v)-6)+'px';tip.classList.add('show')};
    h.addEventListener('mouseenter',show);h.addEventListener('click',show);h.addEventListener('mouseleave',()=>tip.classList.remove('show'))});
}

function renderDebts(){
  const act=S.debts.filter(d=>+d.balance>0),tot=act.reduce((s,d)=>s+(+d.balance||0),0),mins=act.reduce((s,d)=>s+(+d.min||0),0);
  const orig=S.debts.reduce((s,d)=>s+Math.max(+d.orig||0,+d.balance||0),0),paidOff=orig-tot;
  let h='';
  if(!S.debts.length){h=`<div class="card empty"><div class="e">💳</div><p>ยังไม่มีหนี้ที่บันทึกไว้ เพิ่มบัตรเครดิต สินเชื่อบ้าน/รถ หรือหนี้อื่นๆ เพื่อวางแผนปลดหนี้ให้เร็วที่สุดและเสียดอกเบี้ยน้อยที่สุด</p><button class="btn grad" onclick="openDebt()">+ เพิ่มหนี้</button></div>`;
    document.getElementById('goalsBody').innerHTML=h;return}
  const sim=simDebts(UI.strat,UI.extra),alt=simDebts(UI.strat==='snowball'?'avalanche':'snowball',UI.extra),base=simDebts(UI.strat,0);
  h+=`<div class="hero dhero"><div class="lbl">หนี้คงเหลือทั้งหมด</div><div class="amt num">${fmt(tot)}</div>
    <div class="row"><div class="chip"><span>ผ่อนขั้นต่ำ/เดือน</span><b class="num">${fmt(mins)}</b></div><div class="chip"><span>ปลดหนี้ได้</span><b>${!sim?'🎉 หมดแล้ว':sim.never?'—':addMonthsLabel(sim.months)}</b></div></div>
    <div class="rate">จ่ายไปแล้ว ${orig?Math.round(paidOff/orig*100):0}% ของยอดเริ่มต้น<div class="bar"><i style="width:${orig?clamp(paidOff/orig*100,0,100):0}%"></i></div></div></div>`;
  if(sim){
    h+=`<div class="card"><h3>แผนปลดหนี้</h3>
    <div class="seg-c" id="stratSeg"><button data-v="avalanche" class="${UI.strat==='avalanche'?'on':''}">🏔️ ดอกเบี้ยสูงก่อน</button><button data-v="snowball" class="${UI.strat==='snowball'?'on':''}">⛄ ยอดน้อยก่อน</button></div>
    <div class="mini" style="margin:-4px 2px 10px">${UI.strat==='avalanche'?'Avalanche: โปะหนี้ดอกเบี้ยสูงสุดก่อน — เสียดอกเบี้ยรวมน้อยที่สุด':'Snowball: ปิดหนี้ก้อนเล็กก่อน — เห็นผลเร็ว มีกำลังใจ'}</div>
    <div class="group"><div class="field"><label style="width:auto;flex:1">โปะเพิ่มต่อเดือน</label><input type="number" inputmode="decimal" id="extraIn" value="${UI.extra||''}" placeholder="0" style="max-width:130px"></div></div>
    <div class="chips in" id="extraChips">${[0,500,1000,2000,5000].map(v=>`<button data-v="${v}" class="${(+UI.extra||0)===v?'on':''}">${v?'+'+fmtK(v):'ไม่โปะ'}</button>`).join('')}</div>
    ${sim.never?`<div class="note" style="color:var(--bad)">⚠️ ยอดผ่อนรวมยังไม่พอจ่ายดอกเบี้ย หนี้จะไม่ลดลง — ลองเพิ่มยอดโปะ หรือตรวจยอดผ่อนขั้นต่ำ</div>`:`
    <div class="kpi3"><div><span>ปลดหนี้ใน</span><b>${sim.months} เดือน</b></div><div><span>ดอกเบี้ยรวม</span><b class="num">${fmtK(sim.interest)}</b></div><div><span>หมดหนี้</span><b>${addMonthsLabel(sim.months)}</b></div></div>
    ${UI.extra>0&&base&&!base.never?`<div class="note" style="margin:10px 2px 0">💡 โปะเพิ่ม ${fmt(UI.extra)}/เดือน ช่วยให้หมดหนี้เร็วขึ้น <b>${base.months-sim.months} เดือน</b> และประหยัดดอกเบี้ย <b>${fmt(base.interest-sim.interest)}</b></div>`:''}
    ${alt&&!alt.never&&Math.abs(alt.interest-sim.interest)>1?`<div class="note" style="margin:6px 2px 0">เทียบอีกวิธี: ${alt.interest>sim.interest?`วิธีนี้ประหยัดดอกเบี้ยกว่า ${fmt(alt.interest-sim.interest)}`:`อีกวิธีประหยัดดอกเบี้ยกว่า ${fmt(sim.interest-alt.interest)}`}</div>`:''}
    <div class="lineC" id="debtC" style="margin-top:10px"></div>
    <div class="glabel" style="margin-top:12px">ลำดับการโปะ</div>
    ${sim.order.map((id,i)=>{const d=S.debts.find(x=>x.id===id);return `<div class="row-i"><div class="ic" style="background:var(--fill);color:var(--ink);font-weight:800;font-size:15px">${i+1}</div><div class="grow"><div class="t1">${d.e||'💳'} ${esc(d.name)}</div><div class="t2">${fmt(d.balance)} · ดอกเบี้ย ${+d.rate||0}%/ปี</div></div><div class="amtR" style="font-size:13.5px">หมด ${addMonthsLabel(sim.payoff[id]||sim.months)}</div></div>`}).join('')}`}
    </div>`;}
  h+=`<div class="card"><h3>รายการหนี้ <button class="link" onclick="openDebt()">+ เพิ่ม</button></h3>${S.debts.map(d=>{const o=Math.max(+d.orig||0,+d.balance||0),p=o?clamp((o-d.balance)/o*100,0,100):0;const done=!(+d.balance>0);
    return `<div class="row-i tap" onclick="openDebt('${d.id}')"><div class="ic" style="background:${done?'#30C26A':'linear-gradient(145deg,#FF375F,#FF9F0A)'}">${done?'✓':(d.e||'💳')}</div><div class="grow"><div style="display:flex;justify-content:space-between;gap:8px"><span class="t1">${esc(d.name)}</span><span class="num" style="font-weight:700;font-size:14.5px">${fmt(d.balance)}</span></div>
    <div class="pb"><i style="width:${p}%;background:#30C26A"></i></div><div class="t2">${done?'🎉 ปิดหนี้แล้ว':`ดอกเบี้ย ${+d.rate||0}% · ผ่อน ${fmt(d.min)}${d.day?' ทุกวันที่ '+d.day:''}${debtPaidIn(d,monthKey(new Date()))?' · ✓ เดือนนี้จ่ายแล้ว':''}`}</div></div></div>`}).join('')}</div>`;
  document.getElementById('goalsBody').innerHTML=h;
  if(sim&&!sim.never)lineChart('debtC',sim.series.map((v,i)=>({label:i?addMonthsLabel(i).replace(/\s?\d{4}$/,''):'ตอนนี้',v,i})),'#FF2D55',null,p=>`<b>${p.i?addMonthsLabel(p.i):'ตอนนี้'}</b><br>หนี้คงเหลือ ${fmt(p.v)}`);
  const ss=document.getElementById('stratSeg');if(ss)ss.onclick=e=>{const b=e.target.closest('button');if(b){UI.strat=b.dataset.v;renderDebts()}};
  const ec=document.getElementById('extraChips');if(ec)ec.onclick=e=>{const b=e.target.closest('button');if(b){UI.extra=+b.dataset.v;renderDebts()}};
  const ei=document.getElementById('extraIn');if(ei)ei.onchange=()=>{UI.extra=Math.max(0,parseFloat(ei.value)||0);renderDebts()};
}

/* ================= sheets ================= */
let onSave=null;
function openSheet(title,html,save,saveLabel){
  document.getElementById('shTitle').textContent=title;document.getElementById('shBody').innerHTML=html;
  const sb=document.getElementById('shSave');sb.textContent=saveLabel||'บันทึก';sb.style.visibility=save?'visible':'hidden';onSave=save;
  document.getElementById('shCancel').textContent=save?'ยกเลิก':'ปิด';
  document.getElementById('scrim').classList.add('on');document.getElementById('sheet').classList.add('on');
  document.getElementById('shBody').scrollTop=0;
}
function closeSheet(){KP=null;document.getElementById('scrim').classList.remove('on');document.getElementById('sheet').classList.remove('on');onSave=null}
document.getElementById('scrim').onclick=closeSheet;
document.getElementById('shCancel').onclick=closeSheet;
document.getElementById('shSave').onclick=async()=>{if(onSave){const r=await onSave();if(r!==false)closeSheet()}};

function whoPicker(sel){return `<div class="who" id="whoP">${['a','b','both'].map(w=>`<button type="button" data-w="${w}" class="${sel===w?'on':''}"><span class="e">${whoEmoji(w)}</span>${esc(whoName(w))}</button>`).join('')}</div>`}
function bindPick(id,attr,cb){const box=document.getElementById(id);box.addEventListener('click',e=>{const b=e.target.closest('['+attr+']');if(!b)return;box.querySelectorAll('['+attr+']').forEach(x=>x.classList.toggle('on',x===b));if(cb)cb(b.getAttribute(attr))})}
function picked(id,attr){const el=document.querySelector('#'+id+' .on');return el?el.getAttribute(attr):null}
function setPick(id,attr,val){document.querySelectorAll('#'+id+' ['+attr+']').forEach(x=>x.classList.toggle('on',x.getAttribute(attr)===val))}

function templates(type){const m={};S.tx.filter(t=>t.type===type&&t.note&&!t.bill&&!t.debt).forEach(t=>{const k=t.note.trim()+'|'+t.cat;const o=m[k]=m[k]||{note:t.note.trim(),cat:t.cat,who:t.who,amount:t.amount,n:0,ts:0};o.n++;if((t.ts||0)>=o.ts){o.ts=t.ts||0;o.amount=t.amount;o.who=t.who}});
  return Object.values(m).sort((a,b)=>b.n-a.n||b.ts-a.ts).slice(0,8)}

let KP=null;
document.addEventListener('keydown',e=>{if(!KP)return;const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))return;
  const m={'Backspace':'del','Enter':'ok','-':'-','+':'+','*':'*','x':'*','.':'.'};const k=/^[0-9]$/.test(e.key)?e.key:m[e.key];if(k){e.preventDefault();KP(k)}});
function openTx(id,forceType,again){
  const t=id?S.tx.find(x=>x.id===id):null;
  let type=t?t.type:(forceType||'expense'), cat=t?t.cat:null, expr=t?String(t.amount):'', date=t?t.date:(again&&again.date)||todayStr();
  const tpl={expense:templates('expense'),income:templates('income')};
  const html=`<div class="seg-c" id="tType"><button type="button" data-v="expense">💸 รายจ่าย</button><button type="button" data-v="income">💰 รายรับ</button></div>
  <div class="amt-disp"><div class="expr" id="exprL">&nbsp;</div><div class="amt-big num" id="amtL">฿0</div></div>
  <div class="sugg" id="sugg"></div>
  <div class="cat-row" id="catRow"></div>
  <div class="hintB" id="bHint"></div>
  ${whoPicker(t?t.who:(again&&again.who)||'a')}
  <div class="date-row" id="dateRow"><button type="button" data-d="0">วันนี้</button><button type="button" data-d="1">เมื่อวาน</button>
    <label class="dpick"><span>📅</span><span id="dLbl"></span><input type="date" id="dIn" value="${date}"></label></div>
  <div class="note-in"><span>✏️</span><input id="nIn" placeholder="โน้ต เช่น ข้าวเย็น #ทริปเชียงใหม่" maxlength="80" value="${esc(t?t.note:'')}"></div>
  ${t?`<div style="display:flex;gap:8px;margin:10px 0"><button class="btn ghost full" id="dupTx">⧉ ทำซ้ำเป็นวันนี้</button><button class="btn danger full" id="delTx">ลบ</button></div>`:`<button class="btn ghost full" id="saveMore" style="margin:10px 0">บันทึก แล้วเพิ่มรายการต่อ</button>`}
  ${t&&t.bill?'<div class="note" style="text-align:center">🔁 รายการนี้มาจากรายการประจำ</div>':''}
  <div class="keypad" id="kp">${['1','2','3','+','4','5','6','-','7','8','9','del','.','0','*','ok'].map(k=>`<button type="button" data-k="${k}" class="${k==='ok'?'ok':/[+\-*]|del/.test(k)?'op':''}">${k==='del'?'⌫':k==='ok'?'✓':k==='-'?'−':k==='*'?'×':k}</button>`).join('')}</div>`;
  const doSave=async()=>{
    const amt=evalAmt(expr);
    if(!(amt>0)){toast('กรอกจำนวนเงินก่อนนะ');shake();return false}
    const o={id:t?t.id:uid(),type,amount:amt,cat,who:picked('whoP','data-w')||'a',date,note:document.getElementById('nIn').value.trim(),ts:t?t.ts:Date.now()};
    if(t&&t.bill)o.bill=t.bill; if(t&&t.debt)o.debt=t.debt;
    await write('tx',o);toast((t?'อัปเดตแล้ว ✓ ':'บันทึกแล้ว ✓ ')+(type==='income'?'+':'−')+fmt(amt));
    if(!t&&o.date.slice(0,7)!==UI.month){UI.month=o.date.slice(0,7);render()}
    return o;
  };
  openSheet(t?'แก้ไขรายการ':'บันทึกรายการ',html,doSave);
  const $=i=>document.getElementById(i);
  const shake=()=>{const el=$('amtL');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')};
  const hint=()=>{const el=$('bHint');const bg=+(S.settings.budgets||{})[cat]||0;
    if(type!=='expense'||!bg){el.classList.remove('on');return}
    const sp=catTotals(txOf(date.slice(0,7)))[cat]||0;const cur=t&&t.cat===cat&&t.date.slice(0,7)===date.slice(0,7)?+t.amount:0;
    const left=bg-sp+cur-(evalAmt(expr)||0);
    el.innerHTML=`${CAT[cat].e} งบ${CAT[cat].name}เดือนนี้ ${left>=0?`เหลือ <b>${fmt(left)}</b> หลังรายการนี้`:`<span class="over">จะเกินงบ ${fmt(-left)}</span>`}`;el.classList.add('on')};
  const drawAmt=()=>{const v=evalAmt(expr);$('amtL').textContent=fmt(v>0?v:0,(v%1)!==0);
    $('amtL').style.color=type==='income'?'#1E9E50':'var(--ink)';
    $('exprL').textContent=/[+\-*]/.test(expr)?expr.replace(/-/g,' − ').replace(/\+/g,' + ').replace(/\*/g,' × '):' ';hint()};
  const drawSugg=()=>{const tp=tpl[type];$('sugg').innerHTML=tp.slice(0,8).map((x,i)=>`<button type="button" data-i="${i}">${CAT[x.cat]?.e||''} ${esc(x.note)} · ${fmtK(x.amount)}</button>`).join('')};
  const drawCats=()=>{const cats=type==='expense'?EXP:INC;if(!cats.some(c=>c.id===cat))cat=cats[0].id;
    $('catRow').innerHTML=cats.map(c=>`<button type="button" class="cchip ${c.id===cat?'on':''}" data-c="${c.id}" style="--c:${c.c}"><span class="ic" style="background:${c.c}">${c.e}</span>${c.name}</button>`).join('');
    document.querySelectorAll('#tType button').forEach(b=>b.classList.toggle('on',b.dataset.v===type));drawSugg();drawAmt();
    const on=$('catRow').querySelector('.on');if(on&&t)on.scrollIntoView({inline:'center',block:'nearest'})};
  const drawDate=()=>{$('dLbl').textContent=dateLabel(date);const y=new Date();y.setDate(y.getDate()-1);const ys=dstr(y);
    document.querySelectorAll('#dateRow [data-d]').forEach(b=>b.classList.toggle('on',(b.dataset.d==='0'&&date===todayStr())||(b.dataset.d==='1'&&date===ys)));
    document.querySelector('#dateRow .dpick').classList.toggle('on',date!==todayStr()&&date!==ys);hint()};
  const press=k=>{
    const cur=expr.split(/[+\-*]/).pop();
    if(k==='ok'){$('shSave').click();return}
    if(k==='del')expr=expr.slice(0,-1);
    else if(/[+\-*]/.test(k)){if(!expr)return;expr=/[+\-*]$/.test(expr)?expr.slice(0,-1)+k:expr+k}
    else if(k==='.'){if(cur.includes('.'))return;expr+=cur?'.':'0.'}
    else{if(expr.length>=18||/\.\d\d$/.test(cur))return;if(cur==='0')expr=expr.slice(0,-1);expr+=k}
    if(navigator.vibrate)try{navigator.vibrate(8)}catch(e){}
    drawAmt()};
  KP=press;
  $('kp').onclick=e=>{const b=e.target.closest('[data-k]');if(b)press(b.dataset.k)};
  $('tType').onclick=e=>{const b=e.target.closest('button');if(b){type=b.dataset.v;drawCats()}};
  $('catRow').onclick=e=>{const b=e.target.closest('[data-c]');if(!b)return;cat=b.dataset.c;document.querySelectorAll('#catRow .cchip').forEach(x=>x.classList.toggle('on',x===b));hint()};
  $('dateRow').onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;const d=new Date();d.setDate(d.getDate()-(+b.dataset.d));date=dstr(d);$('dIn').value=date;drawDate()};
  $('dIn').onchange=e=>{if(e.target.value){date=e.target.value;drawDate()}};
  $('sugg').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const x=tpl[type][+b.dataset.i];
    cat=x.cat;$('nIn').value=x.note;if(!(evalAmt(expr)>0))expr=String(x.amount);setPick('whoP','data-w',x.who||'a');drawCats()};
  bindPick('whoP','data-w');
  if(t){
    $('delTx').onclick=async()=>{if(await confirmDlg('ลบรายการนี้?','ลบแล้วกู้คืนไม่ได้')){closeSheet();await remove('tx',t.id);
      if(t.bill){const b=S.bills.find(x=>x.id===t.bill);if(b&&b.paid){const mk=Object.keys(b.paid).find(k=>b.paid[k]===t.id);if(mk){const nb=JSON.parse(JSON.stringify(b));delete nb.paid[mk];await write('bills',nb)}}}
      toast('ลบแล้ว')}};
    $('dupTx').onclick=async()=>{const o=Object.assign({},t,{id:uid(),date:todayStr(),ts:Date.now()});delete o.bill;delete o.debt;closeSheet();await write('tx',o);toast('ทำซ้ำเป็นวันนี้แล้ว ✓')};
  }else{
    $('saveMore').onclick=async()=>{const o=await doSave();if(o){closeSheet();setTimeout(()=>openTx(null,type,{who:o.who,date:o.date}),250)}};
  }
  drawCats();drawDate();
}

function openBudget(){
  const b=S.settings.budgets||{};const ca=catAvg(3),h0=hist(3);
  const html=`<div class="note">ตั้งงบต่อเดือนของแต่ละหมวด (เว้นว่าง = ไม่ตั้งงบ) ใช้ร่วมกันทั้งคู่ทุกเดือน</div>
  <div class="glabel">ตัวช่วยตั้งงบ</div>
  <div class="chips in" id="autoB"><button type="button" data-a="avg">📊 ตามค่าเฉลี่ย 3 เดือน</button><button type="button" data-a="avg90">✂️ ลด 10% จากค่าเฉลี่ย</button><button type="button" data-a="503020">⚖️ 50/30/20 จากรายรับ</button><button type="button" data-a="clear">ล้าง</button></div>
  <div class="group">${EXP.map(c=>`<div class="field"><span class="ic" style="background:${c.c};width:30px;height:30px;font-size:15px;border-radius:9px">${c.e}</span><label style="width:auto;flex:1">${c.name}<span class="mini" style="display:block">เฉลี่ย ${fmt(ca[c.id]||0)}</span></label><input type="number" inputmode="decimal" min="0" data-b="${c.id}" placeholder="—" value="${b[c.id]||''}" style="max-width:110px"></div>`).join('')}</div>
  <div class="note" id="bSum"></div>`;
  openSheet('งบประมาณรายเดือน',html,async()=>{
    const nb={};document.querySelectorAll('[data-b]').forEach(i=>{const v=parseFloat(i.value);if(v>0)nb[i.dataset.b]=v});
    S.settings=Object.assign({},S.settings,{budgets:nb});await saveSettings();toast('บันทึกงบแล้ว ✓');
  });
  const upd=()=>{let s=0;document.querySelectorAll('[data-b]').forEach(i=>s+=parseFloat(i.value)||0);
    document.getElementById('bSum').innerHTML='งบรวม <b>'+fmt(s)+'</b> ต่อเดือน'+(h0.inc?` · คิดเป็น ${Math.round(s/h0.inc*100)}% ของรายรับเฉลี่ย (${fmt(h0.inc)}) → เหลือออม ~${fmt(h0.inc-s)}`:'')};
  document.getElementById('shBody').addEventListener('input',upd);upd();
  const r100=v=>v>0?Math.ceil(v/100)*100:'';
  document.getElementById('autoB').onclick=e=>{const bt=e.target.closest('button');if(!bt)return;const a=bt.dataset.a;
    const set=(id,v)=>{const i=document.querySelector(`[data-b="${id}"]`);if(i)i.value=v};
    if(a==='clear')EXP.forEach(c=>set(c.id,''));
    if(a==='avg'||a==='avg90'){const f=a==='avg'?1:.9;EXP.forEach(c=>set(c.id,r100((ca[c.id]||0)*f)))}
    if(a==='503020'){if(!h0.inc){toast('ยังไม่มีข้อมูลรายรับ');return}
      const grp=(ids,share)=>{const tot=ids.reduce((s,k)=>s+(ca[k]||0),0);ids.forEach(k=>set(k,r100(tot?h0.inc*share*(ca[k]||0)/tot:h0.inc*share/ids.length)))};
      grp(NEEDS,.5);grp(WANTS,.3)}
    upd();toast('กรอกตัวเลขให้แล้ว ปรับได้ก่อนกดบันทึก')};
}

function openBill(id,forceType){
  const b=id?S.bills.find(x=>x.id===id):null;
  let type=b?billType(b):(forceType||'expense');
  const catOpts=()=>(type==='income'?INC:EXP).map(c=>`<option value="${c.id}" ${(b&&billType(b)===type?b.cat:(type==='income'?'salary':'bills'))===c.id?'selected':''}>${c.e} ${c.name}</option>`).join('');
  const html=`<div class="seg-c" id="bType"><button type="button" data-v="expense" class="${type==='expense'?'on':''}">🧾 รายจ่ายประจำ</button><button type="button" data-v="income" class="${type==='income'?'on':''}">💼 รายรับประจำ</button></div>

function openGoal(id,preset){
  const g=id?S.goals.find(x=>x.id===id):null;const p=preset||{};
  let e=g?g.e:(p.e||GOAL_E[0]), col=g?(g.color??0):(p.color??S.goals.length%GOAL_G.length);
  const rem=g?g.target-g.saved:0, md=g&&g.deadline?Math.max(1,monthsUntil(g.deadline)):0;
  const qv=[500,1000,5000];if(md&&rem>0)qv.unshift(Math.ceil(rem/md/100)*100);
  const html=`${g?`<div class="card" style="text-align:center"><div style="font-size:13px;color:var(--muted)">เติมเงินเข้าเป้าหมาย · มีแล้ว ${fmt(g.saved)} / ${fmt(g.target)}</div>
    <div class="amount-box" style="padding:6px 0"><span class="cur">฿</span><input id="dep" class="num" type="number" inputmode="decimal" placeholder="0" style="font-size:36px"></div>
    <div class="chips in" id="depQ" style="justify-content:center">${qv.map((v,i)=>`<button type="button" data-v="${v}">${i===0&&md&&rem>0?'📅 ต่อเดือน ':''}${fmt(v)}</button>`).join('')}</div>
    <div style="display:flex;gap:8px"><button class="btn ghost small" style="flex:1" id="wd">− ถอนออก</button><button class="btn grad small" style="flex:2" id="ad">＋ เติมเงิน</button></div>
    ${(g.log||[]).length?`<div class="lst" style="text-align:left;margin-top:12px">${[...g.log].reverse().slice(0,5).map(l=>`<div class="r"><span>${longDate(l.d)}</span><b class="num ${l.a>0?'inc':''}">${l.a>0?'+':''}${fmt(l.a)}</b></div>`).join('')}</div>`:''}</div>`:''}
  <div class="glabel">ไอคอน</div><div class="cats" id="gE" style="grid-template-columns:repeat(6,1fr)">${GOAL_E.map(x=>`<button type="button" class="cat ${x===e?'on':''}" data-e="${x}" style="font-size:24px;padding:8px 0">${x}</button>`).join('')}</div>
  <div class="glabel">สี</div><div class="cats" id="gC" style="grid-template-columns:repeat(6,1fr)">${GOAL_G.map((x,i)=>`<button type="button" class="cat ${i===col?'on':''}" data-k="${i}" style="padding:6px"><span class="ic" style="background:${x};width:34px;height:34px;border-radius:50%"></span></button>`).join('')}</div>
  <div class="group"><div class="field"><label>ชื่อเป้าหมาย</label><input id="gn" maxlength="40" placeholder="เช่น เที่ยวญี่ปุ่น" value="${esc(g?g.name:(p.name||''))}"></div>
  <div class="field"><label>เป้าหมาย</label><input id="gt" type="number" inputmode="decimal" placeholder="0" value="${g?g.target:(p.target||'')}"></div>
  ${g?'':`<div class="field"><label>มีอยู่แล้ว</label><input id="gs" type="number" inputmode="decimal" placeholder="0"></div>`}
  <div class="field"><label>ภายในวันที่</label><input id="gd" type="date" value="${g&&g.deadline?g.deadline:''}"></div></div>
  <div class="note" id="gPlan"></div>
  ${g?`<button class="btn danger full" id="delG">ลบเป้าหมาย</button>`:''}`;
  openSheet(g?g.name:'เป้าหมายใหม่',html,async()=>{
    const name=document.getElementById('gn').value.trim(),target=parseFloat(document.getElementById('gt').value);
    if(!name||!(target>0)){toast('ใส่ชื่อและยอดเป้าหมายก่อนนะ');return false}
    await write('goals',{id:g?g.id:uid(),name,target,saved:g?g.saved:(parseFloat(document.getElementById('gs').value)||0),e:picked('gE','data-e')||e,color:+(picked('gC','data-k')??col),deadline:document.getElementById('gd').value||'',log:g?g.log||[]:[]});
    toast('บันทึกเป้าหมายแล้ว ✓');
  });
  bindPick('gE','data-e');bindPick('gC','data-k');
  const gp=()=>{const t=parseFloat(document.getElementById('gt').value)||0,s=g?g.saved:(parseFloat((document.getElementById('gs')||{}).value)||0),d=document.getElementById('gd').value;
    const el=document.getElementById('gPlan');if(t>s&&d){const m=Math.max(1,monthsUntil(d));el.innerHTML=`📅 ต้องออมเดือนละ <b>${fmt((t-s)/m)}</b> เป็นเวลา ${m} เดือน`}else el.textContent=''};
  document.getElementById('shBody').addEventListener('input',gp);gp();
  if(g){
    document.getElementById('depQ').onclick=ev=>{const b=ev.target.closest('button');if(b)document.getElementById('dep').value=b.dataset.v};
    const mv=async sign=>{const v=parseFloat(document.getElementById('dep').value);if(!(v>0)){toast('ใส่จำนวนเงินก่อนนะ');return}
      const ng=JSON.parse(JSON.stringify(g));ng.saved=Math.max(0,Math.round(((+ng.saved||0)+sign*v)*100)/100);

    document.getElementById('ad').onclick=()=>mv(1);document.getElementById('wd').onclick=()=>mv(-1);
    document.getElementById('delG').onclick=async()=>{if(await confirmDlg('ลบเป้าหมายนี้?','ยอดที่บันทึกไว้จะหายไปด้วย')){closeSheet();await remove('goals',g.id)}};
  }
}

/* ================= misc UI ================= */
let tT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2600)}
function confirmDlg(title,msg,yes){return new Promise(res=>{const d=document.getElementById('dlg');document.getElementById('dlgT').textContent=title;document.getElementById('dlgP').textContent=msg;
  const y=document.getElementById('dlgYes');y.textContent=yes||'ลบ';d.classList.add('on');
  const fin=v=>{d.classList.remove('on');y.onclick=null;document.getElementById('dlgNo').onclick=null;res(v)};
  y.onclick=()=>fin(true);document.getElementById('dlgNo').onclick=()=>fin(false)})}

const VIEWS=['home','tx','plan','goals'];
function go(v){if(v==='budget'){UI.plan='budget';v='plan'}if(v==='debts'){UI.save='debts';v='goals'}
  if(!VIEWS.includes(v))v='home';UI.view=v;
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.dataset.tab===v));
  if(location.hash!=='#'+v)history.replaceState(null,'','#'+v);
  window.scrollTo({top:0});render()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.tab));
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
document.getElementById('fab').onclick=()=>openTx();
document.getElementById('btnSettings').onclick=openSettings;
document.querySelectorAll('[data-month] button').forEach(b=>b.onclick=()=>{UI.month=shiftMonth(UI.month,+b.dataset.mv);render()});
document.getElementById('txType').onclick=e=>{const b=e.target.closest('button');if(b){UI.type=b.dataset.v;renderTx()}};
document.getElementById('txScope').onclick=e=>{const b=e.target.closest('button');if(b){UI.scope=b.dataset.v;renderTx()}};
document.getElementById('txWho').onclick=e=>{const b=e.target.closest('button');if(b){UI.who=b.dataset.v;renderTx()}};
document.getElementById('txCat').onclick=e=>{const b=e.target.closest('button');if(b){UI.cat=b.dataset.v;renderTx()}};
document.getElementById('planSeg').onclick=e=>{const b=e.target.closest('button');if(b){UI.plan=b.dataset.v;window.scrollTo({top:0});renderPlan()}};
document.getElementById('saveSeg').onclick=e=>{const b=e.target.closest('button');if(b){UI.save=b.dataset.v;renderSave()}};
document.getElementById('q').oninput=e=>{UI.q=e.target.value;renderTx()};
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(UI.view==='home'||UI.view==='plan'||UI.view==='goals')render()},150)});

loadLocal();
go(location.hash.slice(1)||'home');
initDB();
</script>
</body>
</html>
